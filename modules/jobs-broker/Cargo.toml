# The jobs broker: what a fenced pi command asks of the account's systemd,
# which the fence keeps it from reaching, answered only for the process
# asking and only into agents' own work (src/main.rs says why and how).
[package]
name = "jobs-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The serving side every daemon shares (../daemon-serve), which hands an
# ask its connection so the broker knows who asked from the kernel.
daemon-serve = { path = "../daemon-serve" }
# The peer's pidfd (SO_PEERPIDFD) and polling it, which std doesn't name.
libc = "0.2"
serde_json = "1"
# The account's systemd, asked over the session bus, never spawned.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
# The daemon started for a test, and its client, as every daemon's tests
# share them.
daemon-client = { path = "../daemon-client" }
