# The release line's first experiment: asks for one throwaway secret,
# served to the launcher as rows in Asks and released on Joel's yes into
# one fixed checker (src/daemon.rs says how).
[package]
name = "secret-asks"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The serving side every daemon of the shell shares (../daemon-serve).
daemon-serve = { path = "../daemon-serve" }
# Wakes the daemon as an ask's file arrives or goes.
inotify = { version = "0.11", default-features = false }
# The one form every daemon's rows take (../ready-rows).
ready-rows = { path = "../ready-rows" }
serde_json = "1"
# The digest a yes carries back, of everything the line showed.
sha2 = "0.10"

[dev-dependencies]
# Starts the daemon for its test and asks it (../daemon-client).
daemon-client = { path = "../daemon-client" }
