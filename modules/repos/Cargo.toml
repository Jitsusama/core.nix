# repos lists every repository Joel has, each once however many copies of
# it lie on the disk, read from each checkout's and tree's own git files
# (src/lib.rs says how).
[package]
name = "repos"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# GitHub's GraphQL API, over rustls with its own roots, as github-broker
# asks GitHub: the command's alone, under the github feature.
ureq = { version = "3", optional = true }
# The shape every command of ours takes: help, the answer's form, the
# terminal's colours and the shared exits (../terminal-kit).
terminal-kit = { path = "../terminal-kit" }

[features]
default = ["github"]
# Asking GitHub, which only the command does. A crate reading repositories
# through the library leaves it out with `default-features = false`, so it
# carries no HTTP or TLS.
github = ["dep:ureq"]

[[bin]]
name = "repos"
path = "src/main.rs"
required-features = ["github"]
