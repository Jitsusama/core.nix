# repos lists every repository Joel has, each once however many copies of
# it lie on the disk, read from each checkout's and tree's own git files
# (src/lib.rs says how).
[package]
name = "repos"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# How every daemon's receptors are said to mycelium (../receptor-say): a
# refresh says the GitHub receptor through it, the command's alone, under
# the github feature.
receptor-say = { path = "../receptor-say", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# GitHub's GraphQL API, over rustls with its own roots, as github-broker
# asks GitHub: the command's alone, under the github feature.
ureq = { version = "3", optional = true }
# The shape every command of ours takes: help, the answer's form, the
# terminal's colours and the shared exits (../terminal-kit).
terminal-kit = { path = "../terminal-kit" }
# The serving side every daemon of the shell shares, so `repos serve`
# speaks the one daemon interface (../daemon-serve): the command's alone.
daemon-serve = { path = "../daemon-serve", optional = true }

# inotify, which says when a git folder's HEAD or refs change, so the
# daemon reads the disk again only then: Linux's alone, as the daemon is,
# and the command's alone.
[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", default-features = false, optional = true }

[features]
default = ["github"]
# Asking GitHub, serving the daemon and saying the receptor, which only the
# command does. A crate reading repositories through the library leaves it
# out with `default-features = false`, so it carries no HTTP, TLS or socket.
github = ["dep:receptor-say", "dep:ureq", "dep:daemon-serve", "dep:inotify"]

[[bin]]
name = "repos"
path = "src/main.rs"
required-features = ["github"]
