# The agents daemon makes Agents' rows ready for the launcher: how each
# pi session stands, where it sits in its orchestration and what its row
# says, worded from the launcher's own vocabulary (src/lib.rs says how).
[package]
name = "agents"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The shape every command of ours takes: its flags, help, errors and exits.
terminal-kit = { path = "../terminal-kit" }
# The serving side every daemon of the shell shares (../daemon-serve).
daemon-serve = { path = "../daemon-serve" }
# Files another program writes whole and renames into place, heard as each
# lands rather than read again on a clock (src/file.rs).
inotify = { version = "0.11", default-features = false }
# Who asks on the sprouting socket, by the peer's pidfd and the daemon's
# own uid, so only the shell starts new work (src/asker.rs).
libc = "0.2"
# Dollars said as spend-watch says them, so a network's sum of its
# sessions' spend reads as each of them does (src/network_drawer.rs), and
# times sent as the shell words them.
ready-rows = { path = "../ready-rows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The niri checks' judge of who asks, which takes the shell by its program
# alone, as a build sandbox can tell no more; no installed daemon has it
# (src/asker.rs, package.nix's `walks`).
walks = []
