# The agents daemon makes Agents' rows ready for the launcher: how each
# pi session stands, where it sits in its orchestration and what its row
# says, worded from the launcher's own vocabulary (src/lib.rs says how).
[package]
name = "agents"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The serving side every daemon of the shell shares (../daemon-serve).
daemon-serve = { path = "../daemon-serve" }
# Files another program writes whole and renames into place, heard as each
# lands rather than read again on a clock (src/file.rs).
inotify = { version = "0.11", default-features = false }
# Today's date where Joel is, through the C library's localtime_r, as a
# session's figures are dated by it (src/clock.rs).
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
