# Osaka Jade: deep forest greens, parchment text and a jade accent. The
# pigments are Omarchy 4.0.4's, each noted with the name Omarchy gives it:
# https://github.com/omacom/omarchy/blob/c668141e9c42b13c80c9ca4ea108e11708c5e8a5/themes/osaka-jade/colors.toml
# Sage is ours: Omarchy's muted is too faint to read as text, so sage is its
# hue made just light enough to pass 4.5:1 on the background. Reed is ours
# too: text is linen, since Omarchy's foreground, parchment, is too dim on
# the background by APCA (Lc 67.6, where body text needs 75), and muted is
# reed, linen's own hue and chroma made just dark enough to stay Lc 60
# on the background, oklch(0.77 0.034 105.2), so rank reads as lightness
# alone rather than as a change of hue.

name = "Osaka Jade"
appearance = "dark"
# Omarchy's icons for Osaka Jade: Yaru's, in sage.
icons = "Yaru-sage"

# From the background to the brightest text, for what draws in shades.
shades = ["forest", "fern", "moss", "lichen", "seafoam", "parchment", "linen", "cream"]

[palette]
night = "#090f0d"       # darker_background
deep_forest = "#0c1512" # dark_background
forest = "#111c18"      # background
fern = "#23372B"        # lighter_background
moss = "#32473B"        # selection
lichen = "#53685B"      # muted
sage = "#718779"
reed = "#B7B69D"
seafoam = "#81B8A8"     # dark_foreground
parchment = "#C1C497"   # foreground
linen = "#D6D5BC"       # light_foreground
cream = "#F7E8B2"       # bright_foreground
jade = "#509475"        # accent, blue
pine = "#459451"        # yellow
leaf = "#549e6a"        # green
mint = "#63b07a"        # bright_green
turquoise = "#2DD5B7"   # cyan
aqua = "#8CD3CB"        # bright_cyan
mist = "#ACD4CF"        # bright_blue
celadon = "#75bbb3"     # bright_magenta
orchid = "#D2689C"      # magenta
vermilion = "#FF5345"   # red
rose = "#db9f9c"        # bright_red
gold = "#E5C736"        # bright_yellow
bronze = "#a2734b"      # orange
umber = "#513925"       # brown

[colours]
background = "forest"
sunken = "deep_forest"
deepest = "night"
raised = "fern"
selection = "moss"
text = "linen"
strong = "cream"
muted = "reed"
rule = "lichen"
edge = "moss"
shadow = "night"
accent = "jade"
on_accent = "night"
alert = "vermilion"
warning = "gold"
success = "leaf"
# The hues glyphs wear, one per kind of thing.
action = "gold"
program = "aqua"
machine = "rose"
person = "orchid"
voice = "turquoise"

[terminal]
background = "forest"
foreground = "linen"
cursor = "cream"
cursor_text = "forest"
selection_background = "moss"
selection_foreground = "cream"
black = "forest"
red = "vermilion"
green = "leaf"
yellow = "pine"
blue = "jade"
magenta = "orchid"
cyan = "turquoise"
white = "parchment"
bright_black = "sage"
bright_red = "rose"
bright_green = "mint"
bright_yellow = "gold"
bright_blue = "mist"
bright_magenta = "celadon"
bright_cyan = "aqua"
bright_white = "cream"

# Code's colours. Ours: Omarchy gives Neovim bamboo's own colours rather than
# these. Judgement: strings in mint rather than leaf, which sat too near the
# accent, and types in seafoam, quieter than the voice's turquoise; the
# rest wear the colours they fall back to.
[syntax]
string = "mint"
type = "seafoam"

# Omarchy's own paintings for Osaka Jade, chosen by Joel: the glowing city
# behind the desktop, and the green woods and mountains on the lock screen.
[wallpaper]
desktop = "landscapes/glowing-city-green.png"
lock = "landscapes/mountain-woods-green.png"
