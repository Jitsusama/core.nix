# Everyone Joel deals with, held ready for the shell: one resident program
# that runs each People source as a child and answers over a socket in the
# shell's daemon interface (src/main.rs says how).
[package]
name = "people"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Those listed are kept, spaced and told by what changed as every
# daemon's ready rows are (../ready-rows).
ready-rows = { path = "../ready-rows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The daemon started for a test, and its client, as every daemon's tests
# share them (tests/daemon.rs).
daemon-client = { path = "../daemon-client" }
