# github-broker holds a GitHub App's key and hands its installation tokens,
# an hour each, to whatever reaches its socket (src/lib.rs says why).
[package]
name = "github-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Signing the App's JSON web token, RS256, with the key GitHub made; its
# sha2 feature brings the SHA-256 that signing names.
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
serde_json = "1"
# Its help, usage and failures take the shape every command of ours does.
terminal-kit = { path = "../terminal-kit" }
# GitHub's API, over rustls.
ureq = "3"

[dev-dependencies]
# A key of the tests' own, made as they run, so no key sits in the tree.
rand = "0.8"
tempfile = "3"
