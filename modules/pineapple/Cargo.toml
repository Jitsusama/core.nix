# pineapple: whether a message someone wrote is the safe word that stops
# Joel's agents, and what it stops. The library judges (src/lib.rs says
# how the pieces fit); pineapple-slack reads Slack for it, in shadow
# (src/bin/pineapple-slack.rs), and pineapple is Joel's own command to
# list stops and resume them (src/bin/pineapple.rs), refused under pi,
# and the daemon serving them to the launcher (pineapple serve).
[package]
name = "pineapple"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Slack's answers, the log and the stop records are all JSON, and
# sayings.json is the one table of what counts, shared with whatever else
# judges a saying.
serde_json = "1.0"
# Slack's client and Joel's sign-in, through its door that only reads
# (../slack), so nothing here can write to Slack.
slack-people = { path = "../slack" }
# The shape every command of ours takes: its flags, help, errors and ink.
terminal-kit = { path = "../terminal-kit" }
# The shell's daemon interface, which pineapple serve speaks to the
# launcher (docs/daemons.md).
daemon-serve = { path = "../daemon-serve" }
# The replier's one request, a reply in the thread that asked from
# Joel's own account (src/reply.rs), and the phone alert's, listing his
# IMs to find his own and posting there alone (src/phone.rs): the same
# client Slack's module reads with, so the read-only door stays
# read-only.
ureq = { version = "3", features = ["json"] }
# The kernel's name for who pressed (SO_PEERPIDFD), so only Joel's shell
# acts on a stop.
libc = "0.2"

[dev-dependencies]
# A test's client of pineapple serve, asking over its socket.
daemon-client = { path = "../daemon-client" }
