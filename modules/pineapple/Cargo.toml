# pineapple: whether a message someone wrote is the safe word that stops
# Joel's agents, and what it stops. A library with no program yet: the
# readers and the enforcer that will use it come later (src/lib.rs says
# how the pieces fit).
[package]
name = "pineapple"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Only the cases read JSON: sayings.json is the one table of what counts,
# shared with whatever else judges a saying, so the library itself needs
# nothing.
serde_json = "1.0"
