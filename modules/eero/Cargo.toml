# eero reads the home network's eero from eero's cloud, at home or away
# (src/main.rs says how).
[package]
name = "eero"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The ready-row form every daemon serves the launcher's rows in: each row's
# spaced order, and the records a making changed (../ready-rows).
ready-rows = { path = "../ready-rows" }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# The history of what moves, with SQLite built in, as spend-watch has it.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# The shape every command of ours takes: help, the answer's form, the
# terminal's colours and the shared exits (../terminal-kit).
terminal-kit = { path = "../terminal-kit" }
ureq = { version = "3", features = ["json"] }
# The notices, over D-Bus, without a runtime to install, as disk-guard has it.
zbus = "5"
