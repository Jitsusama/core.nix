# eero reads the home network's eero from eero's cloud, at home or away
# (src/main.rs says how).
[package]
name = "eero"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# The history of what moves, with SQLite built in, as spend-watch has it.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
