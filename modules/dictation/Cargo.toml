# dictation: types what's said into the focused window, Whisper's encoder
# on the NPU (src/main.rs says how).
[package]
name = "dictation"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# What counts as a call, and when one starts and ends, kept in one place
# for everything that follows calls; call-transcripts is one.
calls = { path = "../calls" }
# The noise-cancelled microphone is a PipeWire client of its own, so
# nothing slow runs on PipeWire's real-time thread. Asking for 1.2's
# interface gives it what a stream asks for each cycle and target.object;
# nixpkgs' PipeWire is 1.6.
pipewire = { version = "0.10", features = ["v1_2_0"] }
# RNNoise, the light one of the noise-cancelled microphone's cleaners, in
# Rust alone with its weights built in; its defaults are its own command
# line's.
nnnoiseless = { version = "0.5", default-features = false }
# Screenshots are PNGs, which screen-text reads the words of and meaning
# looks at (picture.rs).
png = "0.18"
# The noise-cancelled microphone hands sound between PipeWire's real-time
# thread and its denoiser through rings that never lock or allocate.
rtrb = "0.4"
serde_json = "1.0"
# The shape every command of ours takes (docs/commands.md).
terminal-kit = { path = "../terminal-kit" }
# meaning's models read their words as Hugging Face's tokenizers do,
# from each model's own tokenizer.json, so what the NPU is given is the
# tokens the model was trained on. Oniguruma's patterns, built from its
# bundled source, rather than the progress bars and the training's
# suffix arrays of its defaults.
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# The camera's pictures are JPEGs, which meaning looks at: zune's decoder
# is Rust alone, with its own vector paths for the IDCT and colour.
zune-jpeg = "0.5"

[dev-dependencies]
tempfile = "3"
