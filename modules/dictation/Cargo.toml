# dictation: types what's said into the focused window, Whisper's encoder
# on the NPU (src/main.rs says how).
[package]
name = "dictation"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# What counts as a call, and when one starts and ends, kept in one place
# for everything that follows calls; call-transcripts is one.
calls = { path = "../calls" }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
