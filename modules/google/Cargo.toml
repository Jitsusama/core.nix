# The Google account, for the desktop: one resident program that asks
# Google's own API for the calendar and the mail that wants Joel, and hands what it holds to the shell
# over a socket (src/main.rs says how).
[package]
name = "google"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
inotify = { version = "0.11", default-features = false }
jiff = "0.2"
# The ready-row form every daemon shares: rows' spaced order, and figures
# said as the launcher says them.
ready-rows = { path = "../ready-rows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shape every command of ours takes (docs/commands.md).
terminal-kit = { path = "../terminal-kit" }
ureq = { version = "3", features = ["json"] }
