# The disk guard: two resident programs, one per account and one for the
# system, that keep a disk from filling without breaking a build (src/lib.rs
# says how).
[package]
name = "disk-guard"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
regex-lite = "0.1"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shape every command of ours takes: help, the answer's form, the
# terminal's colours and the shared exits (../terminal-kit).
terminal-kit = { path = "../terminal-kit" }
# The power profile and notices, over D-Bus, without a runtime to install.
zbus = "5"

[dev-dependencies]
tempfile = "3"
# Peer to peer, so scenarios serve the desktop's services without a bus.
zbus = { version = "5", features = ["p2p"] }

[[test]]
name = "guard"
path = "tests/guard/main.rs"

# Its own program, since a test harness's threads would take the signal it
# sends (tests/held-stop.rs).
[[test]]
name = "held-stop"
path = "tests/held-stop.rs"
harness = false
