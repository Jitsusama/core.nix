# The disk guard: two resident programs, one per account and one for the
# system, that keep a disk from filling without breaking a build (src/lib.rs
# says how).
[package]
name = "disk-guard"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
regex-lite = "0.1"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "guard"
path = "tests/guard/main.rs"
