# Joel's kitty, made to behave like a plain terminal: the compositor tiles
# and draws borders, kitty keeps tabs and stays out of the way. The font and
# colours come from theme.conf, which home.nix writes from jitsusama.theme.
# kitty's own guide to every setting: https://sw.kovidgoyal.net/kitty/conf/

include theme.conf

# --- Look ------------------------------------------------------------------
disable_ligatures cursor
# kitty's own gamma draws text thinner than other terminals; "legacy" is
# closer to how WezTerm renders.
text_composition_strategy legacy
scrollback_lines     10000

# A block cursor that fades, as WezTerm's 800 ms linear ease did.
cursor_shape               block
cursor_blink_interval      0.8 linear
cursor_stop_blinking_after 0

# --- Latency ----------------------------------------------------------------
# kitty waits up to 3 ms for input and 10 ms between repaints by default,
# which caps it near 100 frames a second on a 120 Hz panel.
input_delay     0
repaint_delay   2
sync_to_monitor no

# --- Nothing un-terminal-like -----------------------------------------------
hide_window_decorations yes
# No splits: niri tiles, kitty only has tabs.
enabled_layouts stack
confirm_os_window_close 0
# Prompt marks for jumping between commands, while the cursor and the title
# stay zsh's and Neovim's.
shell_integration no-cursor no-title
# A quiet bell that flags the window instead.
enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell yes
# Right-click does nothing rather than extending the selection.
mouse_map right press ungrabbed no_op
copy_on_select        no
strip_trailing_spaces smart
underline_hyperlinks  hover
# Nix updates kitty.
update_check_interval 0

# --- Tabs -------------------------------------------------------------------
tab_bar_edge         bottom
tab_bar_min_tabs     2
tab_bar_style        separator
tab_separator        ""
tab_title_template   " {index}: {title[:28]} "
tab_title_max_length 32
active_tab_font_style   normal
inactive_tab_font_style normal

# --- Remote control, for the agent harness ----------------------------------
allow_remote_control socket-only
listen_on            unix:@kitty-{kitty_pid}

# --- Keys: WezTerm's defaults, and nothing else ------------------------------
# kitty ships about a hundred Ctrl+Shift shortcuts for layouts, splits and
# window sizes that are easy to hit by accident, so start from none.
clear_all_shortcuts yes

map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard
map shift+insert     paste_from_selection

map ctrl+shift+t         new_tab_with_cwd
map ctrl+shift+w         close_tab
map ctrl+shift+n         new_os_window_with_cwd
map ctrl+tab             next_tab
map ctrl+shift+tab       previous_tab
map ctrl+page_down       next_tab
map ctrl+page_up         previous_tab
map ctrl+shift+page_down move_tab_forward
map ctrl+shift+page_up   move_tab_backward
map ctrl+shift+1         goto_tab 1
map ctrl+shift+2         goto_tab 2
map ctrl+shift+3         goto_tab 3
map ctrl+shift+4         goto_tab 4
map ctrl+shift+5         goto_tab 5
map ctrl+shift+6         goto_tab 6
map ctrl+shift+7         goto_tab 7
map ctrl+shift+8         goto_tab 8
map ctrl+shift+9         goto_tab 9

map shift+page_up    scroll_page_up
map shift+page_down  scroll_page_down
map ctrl+shift+home  scroll_home
map ctrl+shift+end   scroll_end
map ctrl+shift+f     search_scrollback
map ctrl+shift+x     show_scrollback
map ctrl+shift+z     show_last_command_output
# WezTerm's quick select: pick a word, path or hash from the screen, or a
# link.
map ctrl+shift+space kitten hints --type word --program @
map ctrl+shift+e     kitten hints --type url
map ctrl+shift+p     command_palette
map ctrl+shift+u     kitten unicode_input

map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0
map ctrl+shift+r     load_config_file

scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
