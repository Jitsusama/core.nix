# The guide: walks a person from a blank laptop to a sealed machine, and
# through its repairs, one step at a time (AGENTS.md says how).
[package]
name = "guide"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# With its plugins, for the vault's key sealed to each YubiKey through
# age-plugin-fido2-hmac.
age = { version = "0.12", features = ["plugin"] }
base64 = "0.22"
crc32fast = "1.5"
# The screen: raw keys and the terminal's size, on a console as anywhere.
crossterm = "0.29"
# Without chrono a file's times are FAT's earliest, so a vault written twice
# from the same files is the same bytes.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
getrandom = "0.4"
libc = "0.2"
# Blinds each RSA signature, as rsa wants a random source for.
rand_core = { version = "0.6", features = ["getrandom"] }
# Signs the stick's boot program. Pure Rust, so it builds for a Mac from
# Linux. RUSTSEC-2023-0071 is a timing leak someone has to measure across
# many signatures; the guide signs once, on the person's own machine, with
# a key anyone able to time it could already read.
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
zeroize = "1.9"

# Opens a stick's whole disk for writing without root, through UDisks2,
# which asks polkit; a Mac asks authopen instead.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"
