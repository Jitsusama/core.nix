# The one key language every surface of ours speaks: Vim's, as Joel's Neovim
# has it (modules/neovim/keys.nix and init.lua), and Vim's own where his
# config says nothing. Each act is named once, with its keys in Neovim's
# notation and the kinds of surface it belongs to; a surface of a kind has
# every act that kind holds, by the keys here, and gives none of these keys
# to anything else. A surface keeps a key of its own only where Vim has
# nothing for the act, as the reader's zoom. keys-speak-the-language holds
# every surface that names its kinds, and Neovim itself, to this file
# (modules/keys/checks.nix), and docs/design.md's Vi's Keys says why.
#
# An act's keys are pressed in normal mode unless its modes say otherwise:
# insert while typing, and visual while selecting.
# One whose takes is "letter" takes the next letter typed as a name, as m
# and ' take a mark's. In one mode a key belongs to one act, whatever kind
# of surface it's pressed on, so a list's l steps into a row as a page's l
# moves right: both are Vim's l.

# How long keys wait, in milliseconds, said once for Neovim and every surface.
[timing]
# A key that could begin a pair waits this long for its second (timeoutlen).
wait = 300
# After this long on a waiting key, the list of what can follow it shows, as
# his which-key's delay.
which-key = 200
# What's copied takes the selection's ground this long, as his on_yank.
yank-flash = 200

[kinds]
field = "a line that's typed in, as the launcher's query line"
list = "rows to move through and act on, as the launcher's"
page = "something read, with no cursor, as the reader's page"
player = "something that plays, as a video"

# Moving, on whatever there's more of than fits.

[acts.down]
keys = ["<Down>", "j"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.up]
keys = ["<Up>", "k"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

# In a list these step out of a row and into it, and on a page they move a
# selection's cursor.
[acts.left]
keys = ["<Left>", "h"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.right]
keys = ["<Right>", "l"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

# Out a level, as his oil's - goes up to the folder holding this.
[acts.out]
keys = ["-", "<BS>"]
kinds = ["list"]

[acts.scroll-down]
keys = ["<C-e>"]
modes = ["normal", "visual"]
kinds = ["page"]

[acts.scroll-up]
keys = ["<C-y>"]
modes = ["normal", "visual"]
kinds = ["page"]

[acts.half-down]
keys = ["<C-d>"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.half-up]
keys = ["<C-u>"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.screen-down]
keys = ["<C-f>", "<PageDown>"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.screen-up]
keys = ["<C-b>", "<PageUp>"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.first]
keys = ["gg"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.last]
keys = ["G"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

# By paragraphs, blocks with no blank line between them being one, and by
# headings, as Vim's } and ]] in markdown.
[acts.paragraph-on]
keys = ["}"]
modes = ["normal", "visual"]
kinds = ["page"]

[acts.paragraph-back]
keys = ["{"]
modes = ["normal", "visual"]
kinds = ["page"]

[acts.heading-on]
keys = ["]]"]
kinds = ["page"]

[acts.heading-back]
keys = ["[["]
kinds = ["page"]

# A page keeps a cursor line it doesn't draw, for these and what acts on the
# line here.
[acts.view-top]
keys = ["H"]
kinds = ["list", "page"]

[acts.view-middle]
keys = ["M"]
kinds = ["list", "page"]

[acts.view-bottom]
keys = ["L"]
kinds = ["list", "page"]

[acts.place-top]
keys = ["zt"]
kinds = ["page"]

[acts.place-middle]
keys = ["zz"]
kinds = ["page"]

[acts.place-bottom]
keys = ["zb"]
kinds = ["page"]

# To a bracket's other end, or with a count that percent of the way down.
[acts.bracket]
keys = ["%"]
kinds = ["page"]

# Jumping, marks and links.

[acts.set-mark]
keys = ["m"]
takes = "letter"
modes = ["normal", "visual"]
kinds = ["page"]

[acts.go-to-mark]
keys = ["'", "`"]
takes = "letter"
modes = ["normal", "visual"]
kinds = ["page"]

[acts.last-jump]
keys = ["''", "``"]
modes = ["normal", "visual"]
kinds = ["page"]

[acts.jump-back]
keys = ["<C-o>"]
modes = ["normal", "visual"]
kinds = ["page"]

[acts.jump-forward]
keys = ["<C-i>"]
modes = ["normal", "visual"]
kinds = ["page"]

# Neovim's gx opens the link under the cursor; a page has none, so each link
# in view is labelled and the label typed stands for it.
[acts.links]
keys = ["gx"]
modes = ["normal", "visual"]
kinds = ["page"]

# The link on the line here, or the file it names, as Ctrl+] follows a tag
# and gf opens the file under the cursor.
[acts.follow-link]
keys = ["<C-]>"]
kinds = ["page"]

[acts.follow-file]
keys = ["gf"]
kinds = ["page"]

# The next file and the one before: his open files, or a page's folder's.
[acts.next-file]
keys = ["]b"]
kinds = ["page"]

[acts.previous-file]
keys = ["[b"]
kinds = ["page"]

# The headings, as a list to go to one from.
[acts.outline]
keys = ["gO"]
kinds = ["page"]

# The command line, for a line's number, :q and :noh.
[acts.command-line]
keys = [":"]
kinds = ["page"]

# Searching, with case ignored until a capital is typed, as his smartcase.

[acts.search-forward]
keys = ["/"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.search-backward]
keys = ["?"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.next]
keys = ["n"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.previous]
keys = ["N"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

# The word here, whole, down or up, with case ignored.
[acts.search-word-forward]
keys = ["*"]
kinds = ["page"]

[acts.search-word-backward]
keys = ["#"]
kinds = ["page"]

# Acting on rows.

# Return does the row, or steps into it, from either mode: ours, as
# design.md settles it.
[acts.do]
keys = ["<CR>"]
modes = ["insert", "normal"]
kinds = ["field", "list"]

# The row's ending act, as Forget It, asking once where it can't be undone.
[acts.ending]
keys = ["dd"]
kinds = ["list"]

# A line's worth copied, with the yank flash: a list's row, or the first
# block in view on a page, which has no cursor.
[acts.copy]
keys = ["yy"]
kinds = ["list", "page"]

[acts.again]
keys = ["."]
kinds = ["list"]

[acts.undo]
keys = ["u"]
kinds = ["list"]

[acts.redo]
keys = ["<C-r>"]
kinds = ["list"]

# The place used last, as his Space Tab goes back to the file used last.
[acts.last-place]
keys = ["<Tab>", "<Space><Tab>"]
kinds = ["list"]

# Selecting, as Vim's visual mode: v by characters, from the first word in
# view on a page, which has no cursor, and V by whole lines, a list's rows or
# a page's paragraphs, items and lines of code. The same key again ends it,
# and the other changes its kind.

[acts.select]
keys = ["v"]
modes = ["normal", "visual"]
kinds = ["page"]

[acts.select-lines]
keys = ["V"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

# While selecting, the cursor on by words, to a line's ends, and to the
# selection's other end; { and } above move it by paragraphs too.

[acts.word-on]
keys = ["w"]
modes = ["visual"]
kinds = ["page"]

[acts.word-back]
keys = ["b"]
modes = ["visual"]
kinds = ["page"]

[acts.word-end]
keys = ["e"]
modes = ["visual"]
kinds = ["page"]

[acts.line-start]
keys = ["0"]
modes = ["visual"]
kinds = ["page"]

[acts.line-end]
keys = ["$"]
modes = ["visual"]
kinds = ["page"]

[acts.other-end]
keys = ["o"]
modes = ["visual"]
kinds = ["page"]

# Vim's text objects, round the cursor: inner, or with the space after.

[acts.in-word]
keys = ["iw"]
modes = ["visual"]
kinds = ["page"]

[acts.a-word]
keys = ["aw"]
modes = ["visual"]
kinds = ["page"]

[acts.in-sentence]
keys = ["is"]
modes = ["visual"]
kinds = ["page"]

[acts.a-sentence]
keys = ["as"]
modes = ["visual"]
kinds = ["page"]

[acts.in-paragraph]
keys = ["ip"]
modes = ["visual"]
kinds = ["page"]

[acts.a-paragraph]
keys = ["ap"]
modes = ["visual"]
kinds = ["page"]

# Code between backticks, as Vim's i` takes what's between two of them,
# and a` the backticks too, with the blanks after them.
[acts.in-code]
keys = ["i`"]
modes = ["visual"]
kinds = ["page"]

[acts.a-code]
keys = ["a`"]
modes = ["visual"]
kinds = ["page"]

# What's selected copied, with the yank flash, and Ctrl+C as everywhere else.
[acts.copy-selection]
keys = ["y", "<C-c>"]
modes = ["visual"]
kinds = ["page"]

# The paragraph in view copied, as yip copies the one under the cursor.
[acts.copy-paragraph]
keys = ["yip"]
kinds = ["page"]

# The field, from normal mode: into insert at the caret, after it, at the
# line's start or its end, or clearing the line first.

[acts.insert]
keys = ["i"]
kinds = ["field"]

[acts.append]
keys = ["a"]
kinds = ["field"]

[acts.insert-at-start]
keys = ["I"]
kinds = ["field"]

[acts.append-at-end]
keys = ["A"]
kinds = ["field"]

[acts.change-line]
keys = ["cc", "S"]
kinds = ["field"]

# The field, while typing: Vim's insert mode, and his completion menu's keys
# for the rows below it (keys.nix, with suggestions).

[acts.caret-left]
keys = ["<Left>"]
modes = ["insert"]
kinds = ["field"]

[acts.caret-right]
keys = ["<Right>"]
modes = ["insert"]
kinds = ["field"]

[acts.caret-start]
keys = ["<Home>"]
modes = ["insert"]
kinds = ["field"]

[acts.caret-end]
keys = ["<End>"]
modes = ["insert"]
kinds = ["field"]

[acts.delete-word]
keys = ["<C-w>"]
modes = ["insert"]
kinds = ["field"]

[acts.delete-to-start]
keys = ["<C-u>"]
modes = ["insert"]
kinds = ["field"]

[acts.next-row]
keys = ["<Down>", "<Tab>", "<C-n>"]
modes = ["insert"]
kinds = ["field"]

[acts.previous-row]
keys = ["<Up>", "<S-Tab>", "<C-p>"]
modes = ["insert"]
kinds = ["field"]

[acts.take-name]
keys = ["<C-y>"]
modes = ["insert"]
kinds = ["field"]

# Escape takes one step back: from insert or visual to normal, or it cancels
# what's waiting, or at rest steps out a level.
[acts.back]
keys = ["<Esc>"]
modes = ["insert", "normal", "visual"]
kinds = ["field", "list"]

# Everywhere.

# q closes, as his Neovim closes help and its plugin windows, and Space w
# as it closes a split.
[acts.close]
keys = ["q", "ZZ", "<Space>w"]
modes = ["normal", "visual"]
kinds = ["list", "page", "player"]

[acts.show-keys]
keys = ["<Space>?", "<F1>"]
modes = ["normal", "visual"]
kinds = ["list", "page", "player"]

# To the window that way, as his splits go. No kind holds these: a surface
# with windows side by side takes them.

[acts.window-left]
keys = ["<Space><Left>"]
kinds = []

[acts.window-right]
keys = ["<Space><Right>"]
kinds = []

[acts.window-up]
keys = ["<Space><Up>"]
kinds = []

[acts.window-down]
keys = ["<Space><Down>"]
kinds = []
