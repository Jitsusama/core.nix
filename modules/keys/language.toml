# The one key language every surface of ours speaks: Vim's, as Joel's Neovim
# has it (modules/neovim/keys.nix and init.lua), and Vim's own where his
# config says nothing. Each act is named once, with its keys in Neovim's
# notation and the kinds of surface it belongs to; a surface of a kind has
# every act that kind holds, by the keys here, and gives none of these keys
# to anything else. A surface keeps a key of its own only where Vim has
# nothing for the act, as the reader's zoom. keys-speak-the-language holds
# every surface that names its kinds, and Neovim itself, to this file
# (modules/keys/checks.nix), and docs/design.md's Vi's Keys says why.
#
# An act's keys are pressed in normal mode unless its modes say otherwise.
# One whose takes is "letter" takes the next letter typed as a name, as m
# and ' take a mark's. In one mode a key belongs to one act, whatever kind
# of surface it's pressed on, so a list's l steps into a row as a page's l
# moves right: both are Vim's l.

# How long keys wait, in milliseconds, said once for Neovim and every surface.
[timing]
# A key that could begin a pair waits this long for its second (timeoutlen).
wait = 300
# After this long on a waiting key, the list of what can follow it shows, as
# his which-key's delay.
which-key = 200
# What's copied takes the selection's ground this long, as his on_yank.
yank-flash = 200

[kinds]
field = "a line that's typed in, as the launcher's query line"
list = "rows to move through and act on, as the launcher's"
page = "something read, with no cursor, as the reader's page"
player = "something that plays, as a video"

# Moving, on whatever there's more of than fits.

[acts.down]
keys = ["j", "<Down>"]
kinds = ["list", "page"]

[acts.up]
keys = ["k", "<Up>"]
kinds = ["list", "page"]

# In a list these step out of a row and into it.
[acts.left]
keys = ["h", "<Left>"]
kinds = ["list"]

[acts.right]
keys = ["l", "<Right>"]
kinds = ["list"]

# Out a level, as his oil's - goes up to the folder holding this.
[acts.out]
keys = ["-", "<BS>"]
kinds = ["list"]

[acts.scroll-down]
keys = ["<C-e>"]
kinds = ["page"]

[acts.scroll-up]
keys = ["<C-y>"]
kinds = ["page"]

[acts.half-down]
keys = ["<C-d>"]
kinds = ["list", "page"]

[acts.half-up]
keys = ["<C-u>"]
kinds = ["list", "page"]

[acts.screen-down]
keys = ["<C-f>", "<PageDown>"]
kinds = ["list", "page"]

[acts.screen-up]
keys = ["<C-b>", "<PageUp>"]
kinds = ["list", "page"]

[acts.first]
keys = ["gg"]
kinds = ["list", "page"]

[acts.last]
keys = ["G"]
kinds = ["list", "page"]

[acts.view-top]
keys = ["H"]
kinds = ["list"]

[acts.view-middle]
keys = ["M"]
kinds = ["list"]

[acts.view-bottom]
keys = ["L"]
kinds = ["list"]

# Jumping, marks and links.

[acts.set-mark]
keys = ["m"]
takes = "letter"
kinds = ["page"]

[acts.go-to-mark]
keys = ["'", "`"]
takes = "letter"
kinds = ["page"]

[acts.last-jump]
keys = ["''", "``"]
kinds = ["page"]

[acts.jump-back]
keys = ["<C-o>"]
kinds = ["page"]

[acts.jump-forward]
keys = ["<C-i>"]
kinds = ["page"]

# Neovim's gx opens the link under the cursor; a page has none, so each link
# in view is labelled and the label typed stands for it.
[acts.links]
keys = ["gx"]
kinds = ["page"]

# Searching, with case ignored until a capital is typed, as his smartcase.

[acts.search-forward]
keys = ["/"]
kinds = ["list", "page"]

[acts.search-backward]
keys = ["?"]
kinds = ["list", "page"]

[acts.next]
keys = ["n"]
kinds = ["list", "page"]

[acts.previous]
keys = ["N"]
kinds = ["list", "page"]

# Acting on rows.

# Return does the row, or steps into it, from either mode: ours, as
# design.md settles it.
[acts.do]
keys = ["<CR>"]
modes = ["insert", "normal"]
kinds = ["field", "list"]

# The row's ending act, as Forget It, asking once where it can't be undone.
[acts.ending]
keys = ["dd"]
kinds = ["list"]

# The row's Copy act, with the yank flash.
[acts.copy]
keys = ["yy"]
kinds = ["list"]

[acts.select-rows]
keys = ["V"]
kinds = ["list"]

[acts.again]
keys = ["."]
kinds = ["list"]

[acts.undo]
keys = ["u"]
kinds = ["list"]

[acts.redo]
keys = ["<C-r>"]
kinds = ["list"]

# The place used last, as his Space Tab goes back to the file used last.
[acts.last-place]
keys = ["<Tab>", "<Space><Tab>"]
kinds = ["list"]

# The field, from normal mode: into insert at the caret, after it, at the
# line's start or its end, or clearing the line first.

[acts.insert]
keys = ["i"]
kinds = ["field"]

[acts.append]
keys = ["a"]
kinds = ["field"]

[acts.insert-at-start]
keys = ["I"]
kinds = ["field"]

[acts.append-at-end]
keys = ["A"]
kinds = ["field"]

[acts.change-line]
keys = ["cc", "S"]
kinds = ["field"]

# The field, while typing: Vim's insert mode, and his completion menu's keys
# for the rows below it (keys.nix, with suggestions).

[acts.caret-left]
keys = ["<Left>"]
modes = ["insert"]
kinds = ["field"]

[acts.caret-right]
keys = ["<Right>"]
modes = ["insert"]
kinds = ["field"]

[acts.line-start]
keys = ["<Home>"]
modes = ["insert"]
kinds = ["field"]

[acts.line-end]
keys = ["<End>"]
modes = ["insert"]
kinds = ["field"]

[acts.delete-word]
keys = ["<C-w>"]
modes = ["insert"]
kinds = ["field"]

[acts.delete-to-start]
keys = ["<C-u>"]
modes = ["insert"]
kinds = ["field"]

[acts.next-row]
keys = ["<Down>", "<Tab>", "<C-n>"]
modes = ["insert"]
kinds = ["field"]

[acts.previous-row]
keys = ["<Up>", "<S-Tab>", "<C-p>"]
modes = ["insert"]
kinds = ["field"]

[acts.take-name]
keys = ["<C-y>"]
modes = ["insert"]
kinds = ["field"]

# Escape takes one step back: from insert to normal, or it cancels what's
# waiting, or at rest steps out a level.
[acts.back]
keys = ["<Esc>"]
modes = ["insert", "normal"]
kinds = ["field", "list"]

# Everywhere.

# q closes, as his Neovim closes help and its plugin windows, and Space w
# as it closes a split.
[acts.close]
keys = ["q", "ZZ", "<Space>w"]
kinds = ["list", "page", "player"]

[acts.show-keys]
keys = ["<Space>?", "<F1>"]
kinds = ["list", "page", "player"]

# To the window that way, as his splits go. No kind holds these: a surface
# with windows side by side takes them.

[acts.window-left]
keys = ["<Space><Left>"]
kinds = []

[acts.window-right]
keys = ["<Space><Right>"]
kinds = []

[acts.window-up]
keys = ["<Space><Up>"]
kinds = []

[acts.window-down]
keys = ["<Space><Down>"]
kinds = []
