# The one key language every surface of ours speaks: Vim's, as Joel's Neovim
# has it (modules/neovim/keys.nix and init.lua), and Vim's own where his
# config says nothing. Each act is named once, with its keys in Neovim's
# notation, the modes they're pressed in and the kinds of surface it belongs
# to; a surface of a kind has every act with keys that kind holds, by the
# keys here, and gives none of these keys to anything else. A surface keeps
# a key of its own only where Vim has nothing for the act, as the reader's
# zoom. keys-speak-the-language holds every surface that names its kinds,
# and Neovim itself, to this file (modules/keys/checks.nix), and
# docs/design.md's Vi's Keys says why.
#
# An act's keys are pressed in normal mode unless its modes say otherwise.
# One whose takes is "letter" takes the next letter typed as a name, as m
# and ' take a mark's. In one mode a key belongs to one act, whatever kind
# of surface it's pressed on: Vim's l moves right on a page and means
# nothing on a list, and steps into nothing on either.
#
# An act the command line can name has a command, its whole name, and a
# short form, the fewest letters that name it. The short form is written
# here once, never worked out, so :disc can't change meaning when a
# command is added; every name from the short form to the whole one is the
# act's alone. A command Neovim has keeps Neovim's name, short form and
# meaning, and any other is a name Neovim doesn't take, by any of those
# names. An act with a command and no keys is named only on the command
# line, as most of a row's acts are.
#
# Seven flags say what an act does to the world, each false unless set:
# changes, that it changes something beyond where the eye is, as Forget It
# does and moving doesn't; undoable, that u takes the change back while the
# surface stays open; guarded, that it guards itself though it can't be
# undone, as a program asks before it loses work, or a prompt written and
# sent was the asking; costly, that it can't be undone and costs a lot, as
# a network forgotten with its password, a meeting cancelled for everyone
# or the machine rebooted, so d and the command line ask once first,
# answered by Return, and a range taking one asks once naming how many (Joel,
# 2026-11-13: "we should only require confirmation if it is really a
# dangerous action or an action of significant consequence"); anything
# else that changes acts at once. Costly is a stopgap for an act a daemon
# serves: one serving its own costly is asked by that, as agentsd will of
# a session's Close by its work in flight (KP0L6A, by 2026-11-15); range, that it
# takes rows, as :3,5d and a visual selection give them; ends, that it
# ends or takes away, as Disconnect It, Forget It, Close It and :reboot
# do, so Return never runs it from any mode: d or the command line carries
# it, as Vim's changes are operators and Ex commands; and starts, that it
# calls someone or starts something new, as :meet, :dial and :share do,
# which Return leaves to the command line as it does an end (VKCF3Z's
# spec, Return).

# How long keys wait, in milliseconds, said once for Neovim and every surface.
[timing]
# A key that could begin a pair waits this long for its second (timeoutlen).
wait = 300
# After this long on a waiting key, the list of what can follow it shows, as
# his which-key's delay.
which-key = 200
# What's copied takes the selection's ground this long, as his on_yank.
yank-flash = 200

# Each mode has one purpose, the same on every surface.
[modes]
normal = "standing on a thing and acting on it, with nothing typed"
find = "typing what to find on the / line, the rows narrowing as it's typed"
command = "naming a command on the : line, from a menu of every one it can take"
insert = "writing a prompt's words, or a secret's"
visual = "choosing several things for one operator or command"

[kinds]
list = "rows to move through and act on, found by the / line, as the launcher's"
page = "something read, with a cursor line, as the reader's page"
player = "something that plays, as a video"
prompt = "a line of words written to be handed over: a reply, a new name, a save name"
secret = "a one-line password field, always in insert and never leaving it"

# In normal and visual mode no arrow does anything, with Shift or without,
# alone or in a chord: Vim's letters move (Joel, 2026-11-05: "remove them
# and rely only on vi right feeling things"). On a line, the find, the
# command line or a prompt, the arrows are acts of their own below, moving
# the caret and choosing in the menu, as Vim's insert keeps them.

# Moving, on whatever there's more of than fits.

[acts.down]
keys = ["j"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.up]
keys = ["k"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

# On a page these move the cursor along its line, as Vim's h and l do. On a
# list they mean nothing, as in Vim, where h and l never step into or out
# of anything (Joel, 2026-11-05: "where in vi does that step into shit?"):
# Return goes in and - comes up.
[acts.left]
keys = ["h"]
modes = ["normal", "visual"]
kinds = ["page"]

[acts.right]
keys = ["l"]
modes = ["normal", "visual"]
kinds = ["page"]

# Out a level, as his oil's - goes up to the folder holding this, the
# cursor on the row it came from; Backspace is h, so means nothing here.
[acts.out]
keys = ["-"]
kinds = ["list"]

[acts.scroll-down]
keys = ["<C-e>"]
modes = ["normal", "visual"]
kinds = ["page"]

[acts.scroll-up]
keys = ["<C-y>"]
modes = ["normal", "visual"]
kinds = ["page"]

[acts.half-down]
keys = ["<C-d>"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.half-up]
keys = ["<C-u>"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.screen-down]
keys = ["<C-f>", "<PageDown>"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.screen-up]
keys = ["<C-b>", "<PageUp>"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.first]
keys = ["gg"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.last]
keys = ["G"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

# By paragraphs, blocks with no blank line between them being one, and by
# headings, as Vim's } and ]] in markdown. A list's paragraph is a run of
# rows of one kind, or one sender's, that a gap or a change of either ends.
[acts.paragraph-on]
keys = ["}"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.paragraph-back]
keys = ["{"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.heading-on]
keys = ["]]"]
kinds = ["page"]

[acts.heading-back]
keys = ["[["]
kinds = ["page"]

# A page keeps a cursor line, for these and what acts on the line here.
[acts.view-top]
keys = ["H"]
kinds = ["list", "page"]

[acts.view-middle]
keys = ["M"]
kinds = ["list", "page"]

[acts.view-bottom]
keys = ["L"]
kinds = ["list", "page"]

[acts.place-top]
keys = ["zt"]
kinds = ["page"]

[acts.place-middle]
keys = ["zz"]
kinds = ["page"]

[acts.place-bottom]
keys = ["zb"]
kinds = ["page"]

# To a bracket's other end, or with a count that percent of the way down.
[acts.bracket]
keys = ["%"]
kinds = ["page"]

# Jumping, marks and links.

[acts.set-mark]
keys = ["m"]
takes = "letter"
modes = ["normal", "visual"]
kinds = ["page"]

[acts.go-to-mark]
keys = ["'", "`"]
takes = "letter"
modes = ["normal", "visual"]
kinds = ["page"]

[acts.last-jump]
keys = ["''", "``"]
modes = ["normal", "visual"]
kinds = ["page"]

# Back and forward through the places jumped or stepped into. Tab is Ctrl+I
# to a terminal, and a surface that can tell them apart gives Tab the same.
[acts.jump-back]
keys = ["<C-o>"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.jump-forward]
keys = ["<C-i>"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.marks]
command = "marks"
short = "marks"
kinds = ["page"]

[acts.jumps]
command = "jumps"
short = "ju"
kinds = ["page"]

# Neovim's gx opens the link under the cursor; a page has none, so each link
# in view is labelled and the label typed stands for it.
[acts.links]
keys = ["gx"]
modes = ["normal", "visual"]
kinds = ["page"]

# The link on the line here, or the file it names, as Ctrl+] follows a tag
# and gf opens the file under the cursor; on a list, the cursor row in the
# place it lives, as a row found from home, a Now row or a notice's sender
# lives in another, the cursor landing on it there.
[acts.follow-link]
keys = ["<C-]>"]
kinds = ["page", "list"]

# Back through the places Ctrl+] went to, as Vim's Ctrl+T pops its tag
# stack; with none, it says E73: Tag stack empty.
[acts.tag-back]
keys = ["<C-t>"]
kinds = ["list"]

[acts.follow-file]
keys = ["gf"]
kinds = ["page"]

# The next file and the one before: his open files, or a page's folder's.
[acts.next-file]
keys = ["]b"]
command = "bnext"
short = "bn"
kinds = ["page"]

[acts.previous-file]
keys = ["[b"]
command = "bprevious"
short = "bp"
kinds = ["page"]

# The headings, as a list to go to one from.
[acts.outline]
keys = ["gO"]
kinds = ["page"]

# Finding and searching, with case ignored until a capital is typed, as his
# smartcase. On a list / and ? open the find line fresh, going down and up,
# and n and N go on through the rows it found, round past an end; on a page
# they search down and up, and n and N go on.

[acts.search-forward]
keys = ["/"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.search-backward]
keys = ["?"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.next]
keys = ["n"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.previous]
keys = ["N"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

# On a list f and F go to the next row and the one before whose name begins
# with the letter typed after, as Vim's go to a letter on the line, never
# round past an end; ; and , go again, the same way and the other.
[acts.to-letter]
keys = ["f"]
takes = "letter"
modes = ["normal", "visual"]
kinds = ["list"]

[acts.to-letter-backward]
keys = ["F"]
takes = "letter"
modes = ["normal", "visual"]
kinds = ["list"]

[acts.letter-again]
keys = [";"]
modes = ["normal", "visual"]
kinds = ["list"]

[acts.letter-again-backward]
keys = [","]
modes = ["normal", "visual"]
kinds = ["list"]

# The word here, whole, down or up, with case ignored.
[acts.search-word-forward]
keys = ["*"]
kinds = ["page"]

[acts.search-word-backward]
keys = ["#"]
kinds = ["page"]

[acts.nohlsearch]
command = "nohlsearch"
short = "noh"
kinds = ["page"]

# Opening. Return opens the cursor row, from normal or the find line, but
# for one case: on an act that changes something, the find line's Return
# only lands on it, leaving the line for normal, so a name typed and Return
# can never change anything. A held Return's repeats do nothing.

# From the find line: step into a place or a thing with acts, open a
# program, a window, a file or a link, do an act that changes nothing, or
# land on one that does. On a page it goes to the match.
[acts.open]
keys = ["<CR>"]
modes = ["find"]
kinds = ["list", "page"]

# From normal: the same, doing an act that changes something too; on a
# prompt, from normal or insert, hand the words over, and on a secret
# answer.
[acts.do]
keys = ["<CR>"]
modes = ["normal", "insert"]
kinds = ["list", "prompt", "secret"]
changes = true

# From the command line: run exactly what's typed, or what Tab or an arrow
# chose in the menu.
[acts.run]
keys = ["<CR>"]
modes = ["command"]
kinds = ["list", "page"]
changes = true

# Acting on rows. A surface with rows names the acts it has on each by
# their commands below; what d, y, u and . do depends on the row.

# The row's ending act, as a network's Disconnect It or a session's Forget
# It. Whether it asks is the row's act's: forget asks, disconnect doesn't.
[acts.ending]
ends = true
keys = ["dd"]
command = "delete"
short = "d"
kinds = ["list", "page"]
changes = true
undoable = true
range = true

# A line's worth copied, with the yank flash: a list's row, or the block on
# the cursor line on a page.
[acts.copy]
keys = ["yy"]
command = "yank"
short = "y"
kinds = ["list", "page"]
range = true

[acts.again]
keys = ["."]
kinds = ["list"]
changes = true
undoable = true

# The last line a command line ran, run again, as Vim's @: does; with no
# line yet it says E30: No previous command line. Whether it changes
# anything, or asks first, is the line's own act's.
[acts.again-command]
keys = ["@:"]
modes = ["normal"]
kinds = ["list", "page"]

[acts.undo]
keys = ["u"]
command = "undo"
short = "u"
kinds = ["list"]
changes = true
undoable = true

[acts.redo]
keys = ["<C-r>"]
command = "redo"
short = "red"
kinds = ["list"]
changes = true
undoable = true

# The place used last, as his Space Tab goes back to the file used last.
[acts.last-place]
keys = ["<Space><Tab>"]
kinds = ["list"]

# Selecting, as Vim's visual mode: v by characters, from the cursor line on
# a page, and V by whole lines, a list's rows or a page's paragraphs, items
# and lines of code. A list's row has no letters to choose among, so there v
# is V. The same key again ends it, and the other changes its kind.

[acts.select]
keys = ["v"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

[acts.select-lines]
keys = ["V"]
modes = ["normal", "visual"]
kinds = ["list", "page"]

# Vim's gv, the last selection again.
[acts.reselect]
keys = ["gv"]
kinds = ["list"]

# While selecting, the cursor on by words, to a line's ends, and to the
# selection's other end; { and } above move it by paragraphs too.

[acts.word-on]
keys = ["w"]
modes = ["visual"]
kinds = ["page"]

[acts.word-back]
keys = ["b"]
modes = ["visual"]
kinds = ["page"]

[acts.word-end]
keys = ["e"]
modes = ["visual"]
kinds = ["page"]

[acts.line-start]
keys = ["0"]
modes = ["visual"]
kinds = ["page"]

[acts.line-end]
keys = ["$"]
modes = ["visual"]
kinds = ["page"]

[acts.other-end]
keys = ["o"]
modes = ["visual"]
kinds = ["list", "page"]

# Vim's text objects, round the cursor: inner, or with the space after.

[acts.in-word]
keys = ["iw"]
modes = ["visual"]
kinds = ["page"]

[acts.a-word]
keys = ["aw"]
modes = ["visual"]
kinds = ["page"]

[acts.in-sentence]
keys = ["is"]
modes = ["visual"]
kinds = ["page"]

[acts.a-sentence]
keys = ["as"]
modes = ["visual"]
kinds = ["page"]

[acts.in-paragraph]
keys = ["ip"]
modes = ["visual"]
kinds = ["list", "page"]

[acts.a-paragraph]
keys = ["ap"]
modes = ["visual"]
kinds = ["list", "page"]

# Code between backticks, as Vim's i` takes what's between two of them,
# and a` the backticks too, with the blanks after them.
[acts.in-code]
keys = ["i`"]
modes = ["visual"]
kinds = ["page"]

[acts.a-code]
keys = ["a`"]
modes = ["visual"]
kinds = ["page"]

# What's selected copied, with the yank flash, and Ctrl+C as everywhere else.
[acts.copy-selection]
keys = ["y", "<C-c>"]
modes = ["visual"]
kinds = ["page"]

# The paragraph here copied, as yip copies the one under the cursor.
[acts.copy-paragraph]
keys = ["yip"]
kinds = ["page"]

# The same with the blank line after it, as yap copies.
[acts.copy-a-paragraph]
keys = ["yap"]
kinds = ["page"]

# From the block here on to its paragraph's end, as y} copies.
[acts.copy-to-paragraph-end]
keys = ["y}"]
kinds = ["page"]

# Onto a line, from normal: into the find line on a list, which has no text
# of its own, holding the current find, and into insert on a prompt, at the
# caret, after it, at the line's start or its end.

[acts.insert]
keys = ["i"]
kinds = ["list", "prompt"]

[acts.append]
keys = ["a"]
kinds = ["list", "prompt"]

[acts.insert-at-start]
keys = ["I"]
kinds = ["list", "prompt"]

[acts.append-at-end]
keys = ["A"]
kinds = ["list", "prompt"]

# A prompt's words cleared, and insert; a page can't be changed, so there
# it says Vim's E21, as every change below does.
[acts.change-line]
keys = ["cc", "S"]
kinds = ["prompt", "page"]

# Vim's operators and its x and p, which a page has only to refuse, as a
# buffer that can't be modified says E21: d and c wait for their motion,
# or act on a selection at once.
[acts.delete-motion]
keys = ["d"]
takes = "motion"
modes = ["normal", "visual"]
kinds = ["page"]
changes = true

[acts.change-motion]
keys = ["c"]
takes = "motion"
modes = ["normal", "visual"]
kinds = ["page"]
changes = true

[acts.delete-character]
keys = ["x"]
kinds = ["page"]
changes = true

[acts.put-after]
keys = ["p"]
modes = ["normal", "visual"]
kinds = ["page"]
changes = true

# The command line, from normal: on a list it shows the menu of every
# command the cursor row and the surface take, and on a page it takes a
# line's number, :q and :noh.
[acts.command-line]
keys = [":"]
kinds = ["list", "page"]

# On a line, the find, the command line and a prompt: Vim's command line
# and insert keys, and his completion menu's for the rows or the menu below
# it (keys.nix, on the command line). A held key never crosses a mode: a
# held Backspace stops at empty, and only a fresh press leaves the line.

[acts.caret-left]
keys = ["<Left>"]
modes = ["find", "command", "insert"]
kinds = ["list", "prompt"]

[acts.caret-right]
keys = ["<Right>"]
modes = ["find", "command", "insert"]
kinds = ["list", "prompt"]

[acts.caret-start]
keys = ["<Home>"]
modes = ["find", "command", "insert"]
kinds = ["list", "prompt"]

[acts.caret-end]
keys = ["<End>"]
modes = ["find", "command", "insert"]
kinds = ["list", "prompt"]

# The letter before the caret; on an empty find or command line, back to
# normal.
[acts.delete-letter]
keys = ["<BS>", "<C-h>"]
modes = ["find", "command", "insert"]
kinds = ["list", "page", "prompt", "secret"]

[acts.delete-word]
keys = ["<C-w>"]
modes = ["find", "command", "insert"]
kinds = ["list", "page", "prompt", "secret"]

[acts.delete-to-start]
keys = ["<C-u>"]
modes = ["find", "command", "insert"]
kinds = ["list", "page", "prompt", "secret"]

# The clipboard put in at the caret, as Vim's Ctrl+R + puts its register.
[acts.put-clipboard]
keys = ["<C-r>+"]
modes = ["find", "command", "insert"]
kinds = ["list", "prompt"]

# The next row below the find line, or line of the command line's menu,
# and the one before, as his menu chooses; the command line writes what's
# chosen into the line. A page lists nothing under its find line, so there
# they do nothing.
[acts.next-row]
keys = ["<Down>", "<Tab>", "<C-n>"]
modes = ["find", "command"]
kinds = ["list", "page"]

[acts.previous-row]
keys = ["<Up>", "<S-Tab>", "<C-p>"]
modes = ["find", "command"]
kinds = ["list", "page"]

# The chosen row's name, or the menu's chosen line, taken into the line.
[acts.take-name]
keys = ["<C-y>"]
modes = ["find", "command"]
kinds = ["list", "page"]

[acts.menu-away]
keys = ["<C-e>"]
modes = ["command"]
kinds = ["list", "page"]

# Escape takes one step back, as Vim's: from insert, visual, the find line
# or the command line to normal, the rows left as found and the command
# line's covering put back; in normal it cancels a count, a pending
# operator, a waiting key, which-key or the menu. At rest it does nothing,
# as Vim's: it never closes or quits anything of ours, a popup included,
# and never steps out (Joel, 2026-11-05: "fuck escape quitting"); :q, ZZ
# and Space w close. On a secret it cancels, back to what asked, or clears
# the line where there's no cancelling, as at the lock. On a page it
# cancels a selection, a count or a line.
[acts.back]
keys = ["<Esc>"]
modes = ["normal", "insert", "visual", "find", "command"]
kinds = ["list", "page", "prompt", "secret"]

# Ctrl+C leaves a line as Escape does, and cancels a secret.
[acts.leave]
keys = ["<C-c>"]
modes = ["find", "command", "insert"]
kinds = ["list", "page", "secret"]

# Everywhere.

# Closing, as :q closes a window, ZZ as it writes and closes one, and Space
# w as his closes a split. q does nothing by itself, since nothing records.
[acts.close]
keys = ["ZZ", "<Space>w"]
command = "quit"
short = "q"
modes = ["normal", "visual"]
kinds = ["list", "page", "player"]

# :x writes what there is to write and closes, as ZZ.
[acts.xit]
command = "xit"
short = "x"
kinds = ["list"]

[acts.write]
command = "write"
short = "w"
kinds = ["list"]
changes = true
undoable = true

[acts.show-keys]
keys = ["<Space>?", "<F1>"]
command = "help"
short = "h"
modes = ["normal", "visual"]
kinds = ["list", "page", "player"]

# The command line's own, which every list takes: an option, :set wifi or
# :set volume=40, as Vim's are set, undone by u; rows sorted; a command on
# every row matching, or every row not; a place or a path; a window; a
# window below; moving a row to a workspace; the commands run before.

[acts.set]
command = "set"
short = "se"
kinds = ["list"]
changes = true
undoable = true

# An option of what it's on rather than the machine's, as Vim's :setlocal
# sets the buffer's: :setl mute on a program mutes it alone, and a range
# sets each thing's.
[acts.setlocal]
command = "setlocal"
short = "setl"
kinds = ["list"]
changes = true
undoable = true
range = true

[acts.sort]
command = "sort"
short = "sor"
kinds = ["list"]

# On a page it only lists the lines it matches, as gO lists headings.
[acts.global]
command = "global"
short = "g"
kinds = ["list", "page"]
changes = true
undoable = true
range = true

[acts.vglobal]
command = "vglobal"
short = "v"
kinds = ["list"]
changes = true
undoable = true
range = true

# On a page, another file, markdown in its window and anything else as the
# desktop opens it.
[acts.edit]
command = "edit"
short = "e"
kinds = ["list", "page"]

[acts.buffer]
command = "buffer"
short = "b"
kinds = ["list"]

[acts.split]
command = "split"
short = "sp"
kinds = ["list"]

[acts.move]
command = "move"
short = "m"
kinds = ["list"]
changes = true
undoable = true
range = true

[acts.history]
command = "history"
short = "his"
kinds = ["list", "page"]

# Files gathered across folders for one answer, as Vim's arglist; the
# gathered; another folder; a new folder.

[acts.argadd]
command = "argadd"
short = "arga"
kinds = ["list"]
range = true

# Files let go of from what's gathered, as Vim's :argdelete: Unmark All is
# :argd *. Open the Marked is Return on what's gathered.
[acts.argdelete]
command = "argdelete"
short = "argd"
kinds = ["list"]
range = true

[acts.args]
command = "args"
short = "ar"
kinds = ["list"]

[acts.cd]
command = "cd"
short = "cd"
kinds = ["list"]

[acts.mkdir]
command = "mkdir"
short = "mkd"
kinds = ["list"]
changes = true
undoable = true

# A row's acts, each the verb on its row in lower case. A row's verb Vim
# already has for the same thing is Vim's: Go To and Go To {player} are :b,
# to that window; Show Them, Show in Bluetooth, Show in Calendar, All the Notices,
# Guests and Attachments are :e, to that place; Done, Read and Clear are
# :d, the row's ending; every Copy is :y; Save a Copy and Save Here are :w,
# and Replace It :w!; New Window Below is :sp; Move the Meeting, Move to a
# Workspace and Move to a Screen are :m. A row's switch or level is an
# option, set with :set, as Turn the Radio Off is :set nobluetooth and
# Louder :set volume+=5, and a device connected is added to a list,
# :set bluetooth+=Earbuds, as :set wifi=Home-5G joins a network.

# A window closed, as Vim's :close closes one: it can't be brought back,
# but its program asks first where work would be lost, as :close refuses a
# modified buffer, so one closes at once. Close It and Close.
[acts.close-window]
ends = true
command = "close"
short = "clo"
kinds = ["list"]
changes = true
guarded = true
range = true

# WARP connected, as its Connect It: its one link comes up, and Disconnect
# It takes it down, each undone by the other. Wi-Fi and Bluetooth connect
# with :set, since each chooses a network or a device; WARP has one link,
# so it's named by its act. Its short form clears Vim's :con and :conf.
[acts.connect]
command = "connect"
short = "conn"
kinds = ["list"]
changes = true
undoable = true

[acts.disconnect]
ends = true
command = "disconnect"
short = "disc"
kinds = ["list"]
changes = true
undoable = true
range = true

# Forgotten, a network with its password or a device with its pairing, or a
# notice taken away unread: it can't be brought back as it was. A network's
# password or a device's pairing costs a lot to give again, so it's costly;
# a notice's Forget It says how u brings it back, and a session to reopen
# says it costs nothing, so neither asks. wifid and bluez's place should
# each serve costly on their own Forget (KP0L6A to place, by 2026-11-30).
[acts.forget]
ends = true
command = "forget"
short = "forg"
kinds = ["list"]
changes = true
range = true
costly = true

# A device paired, Bluetooth's word, so a network never takes it: a Wi-Fi
# network's New Password is :password and Account Over {method} :signin.
[acts.pair]
command = "pair"
short = "pai"
kinds = ["list"]
changes = true
undoable = true
range = true

# A network's password given again, in a prompt on its row unless it follows
# the command: the old one is gone, but the words typed were the asking.
# Its short form clears Neovim's :packadd and :pause's pau.
[acts.password]
command = "password"
short = "passw"
kinds = ["list"]
changes = true
guarded = true

# Signed in to a network by an account, over the way it names, as :signin
# peap, Sign In being the glossary's word; the account typed was the asking.
# On a password manager's program row it's Let the Launcher In, which asks
# the manager to let Passwords in, as Sign In does a program signed out.
# Its short form clears Neovim's :sign.
[acts.signin]
command = "signin"
short = "signi"
kinds = ["list"]
changes = true
guarded = true

[acts.open-it]
command = "open"
short = "ope"
kinds = ["list"]
range = true

# A meeting joined, and a person called, each opening the call: :join is
# Vim's and :call Vim's, so Join the Meeting, Join Their Call and Join by
# Code are :meet, and Call Them :dial. Each rings or joins other people, so
# it starts something, and Return puts it on the command line, where a
# second Return runs it. A meeting's own row joins on Return from ten
# minutes before it starts all the same, which the row says, not its act.
[acts.meet]
starts = true
command = "meet"
short = "mee"
kinds = ["list"]
changes = true
guarded = true

[acts.dial]
starts = true
command = "dial"
short = "dia"
kinds = ["list"]
changes = true
guarded = true

# A call left, and the screen shared in it: Leave the Call, which ends the
# call, and Share the Screen in the Call, which starts showing it to
# everyone there, so Return runs neither. The leave-call act, since
# [acts.leave] is Ctrl+C on a line.
[acts.leave-call]
ends = true
command = "leave"
short = "lea"
kinds = ["list"]
changes = true

# Showing the screen to everyone in a call can't be taken back once seen,
# so it's costly.
[acts.share]
starts = true
command = "share"
short = "sha"
kinds = ["list"]
changes = true
costly = true

[acts.pause]
command = "pause"
short = "pau"
kinds = ["list"]
changes = true
undoable = true
range = true

[acts.resume]
command = "resume"
short = "resu"
kinds = ["list"]
changes = true
undoable = true
range = true

# A parked session started again in its window, as a message would wake
# it. Nothing is lost by it, since it goes on where it parked and parks
# again once idle, so it asks nothing. Wake.
[acts.wake]
command = "wake"
short = "wak"
kinds = ["list"]
changes = true
guarded = true
range = true

# Words written to whoever sent a notice or a mail, in a prompt on its card
# unless they follow the command: sent, they can't be taken back, but the
# words written and sent were the asking. Reply, and Reply All as :reply all.
[acts.reply]
ends = true
command = "reply"
short = "rep"
kinds = ["list"]
changes = true
guarded = true

# A picture turned, as it's viewed.
[acts.rotate]
command = "rotate"
short = "ro"
kinds = ["list"]

# Pasted into the window that was focused, as Vim's :put puts a register
# after the line; the program's own undo takes it back. Paste.
[acts.put]
command = "put"
short = "pu"
kinds = ["list"]
changes = true
undoable = true

# A new window, as Vim's :new opens one: New Window, Start a Session and
# Wherever It Fits, and New Window Here as :new . for the folder; beside
# kitty's New Window, New Window in a Repository is :new repository and
# SSH to a Machine :new ssh, and a machine's SSH to It is :new. Two acts
# on one row differ by what follows the command, never by its order.
[acts.new]
command = "new"
short = "new"
kinds = ["list"]

# A window sized, as Vim's :resize sizes one, by what follows it: :res
# third, :res half, :res twothirds and :res full for A Third of the Screen,
# Half the Screen, Two Thirds of the Screen and Full Width, Size choosing
# among them.
[acts.resize]
command = "resize"
short = "res"
kinds = ["list"]
changes = true
undoable = true
range = true

[acts.float]
command = "float"
short = "fl"
kinds = ["list"]
changes = true
undoable = true
range = true

# A window brought to the workspace looked at. Bring Here.
[acts.bring]
command = "bring"
short = "bri"
kinds = ["list"]
changes = true
undoable = true
range = true

# What's running stopped, which can't be started again where it was: Stop
# Sharing and a program's Quit, since :stop and :quit are Vim's.
[acts.halt]
ends = true
command = "halt"
short = "ha"
kinds = ["list"]
changes = true
range = true

# An agent's turn stopped, as Ctrl+C interrupts, by the word Vim uses for
# it: the session keeps its work and :reopen brings it back, and the turn
# lost is the one stopped for being wrong, so it doesn't ask. An agent's
# Stop. :intro takes int, so it's inte.
[acts.interrupt]
ends = true
command = "interrupt"
short = "inte"
kinds = ["list"]
changes = true
guarded = true
range = true

# Sessions opened again where they were. Reopen and Reopen Them All.
[acts.reopen]
command = "reopen"
short = "reo"
kinds = ["list"]
changes = true
undoable = true
range = true

# Put off until later, as Not Now does and Keep, since :later and :keep
# are Vim's; it comes back when it's due again.
[acts.snooze]
ends = true
command = "snooze"
short = "snoo"
kinds = ["list"]
changes = true
undoable = true
range = true

# Words to a session or a person: Talk, Talk to {name} and Ask in a Session.
[acts.talk]
command = "talk"
short = "tal"
kinds = ["list"]

# A line filed from the void taken back out of where it was filed, as the
# void's card offers once it says where the line went: Take It Back. It's
# not :undo, which brings back the notices put away.
[acts.take-back]
command = "take"
short = "tak"
kinds = ["list"]
changes = true

# A session started on a quest that orchestrates it and every quest under
# it, beside :new, which starts one that only works on it: a quest's
# Orchestrate.
[acts.orchestrate]
command = "orchestrate"
short = "orch"
kinds = ["list"]

# Words to someone in a new message, a mail's or Slack's, opened to write:
# Write a Mail, Write in Slack and Write to the Guests, since :write is
# Vim's.
[acts.compose]
command = "compose"
short = "compo"
kinds = ["list"]

# Slack searched for words. Search Slack for {words}.
[acts.search]
command = "search"
short = "sea"
kinds = ["list"]

# The same asked again: Try Again, Check It Again, a timer's Start Again,
# and Passwords' Check Every Password, which asks afresh each time.
[acts.retry]
command = "retry"
short = "retr"
kinds = ["list"]

# The eero measuring the most the internet carries each way: Run a Speed
# Test. It fills the internet for most of a minute, as a call would feel,
# so it starts something, and Return puts it on the command line, where a
# second Return runs it. :spe is Neovim's :spellgood, so its short form is
# :spee.
[acts.speedtest]
starts = true
command = "speedtest"
short = "spee"
kinds = ["list"]
changes = true
guarded = true

# More of what counts down: a timer's Add a Minute.
[acts.extend]
command = "extend"
short = "ext"
kinds = ["list"]
changes = true
# A minute more is small and shows at once on the row looked at, so it
# guards itself rather than asking first.
guarded = true

# The stopwatch's count now marked as a lap. :la is Vim's :last, so its
# short form is the whole word.
[acts.lap]
command = "lap"
short = "lap"
kinds = ["list"]
changes = true
# A lap is marked in a moment that's gone by the time a question is
# answered, and shows at once on the row looked at, so it asks nothing.
guarded = true

# The stopwatch set back to nothing, its laps taken away, so Return leaves
# it to the command line (VKCF3Z, 2026-11-08). :res is Neovim's :resize.
[acts.reset]
ends = true
command = "reset"
short = "rese"
kinds = ["list"]
changes = true

# The next track, or with ! the one before: Next Track, Next, Previous
# Track and Previous, since :next and :previous are Vim's.
[acts.skip]
command = "skip"
short = "sk"
kinds = ["list"]

# A mail put away from the inbox; Mail's own undo brings it back. Archive.
[acts.archive]
ends = true
command = "archive"
short = "arc"
kinds = ["list"]
changes = true
undoable = true
range = true

# A choice put to Joel answered: a meeting's Going, Maybe and Not Going, a
# look's own choices, or one of the answers a session offers to its question.
# Answering ends nothing, and stepping into what asks was the deliberate act,
# so one Return answers (VKCF3Z, 2026-11-12: one act, one word).
[acts.answer]
command = "answer"
short = "ans"
kinds = ["list"]
changes = true
undoable = true
range = true

# A meeting called off for everyone in it. Cancel the Meeting. Everyone
# invited is told, which can't be taken back, so it's costly.
[acts.cancel]
ends = true
command = "cancel"
short = "can"
kinds = ["list"]
changes = true
range = true
costly = true

# A person kept at the top of their place, or with ! no longer. Favourite.
[acts.favourite]
command = "favourite"
short = "fa"
kinds = ["list"]
changes = true
undoable = true
range = true

# A keyboard layer held on let go of. Release It.
[acts.release]
ends = true
command = "release"
short = "rel"
kinds = ["list"]
changes = true
undoable = true

# A firmware security setting fwupd changes to what the next level needs:
# Secure It. Not :fix, since Neovim's :fixdel takes it; fwupd's undo takes
# it back, so it acts at once.
[acts.secure]
command = "secure"
short = "sec"
kinds = ["list"]
changes = true

# A firmware's new version put on the device. Install {version}. It takes
# the device out of use while it's written and can't be taken back, so
# it's costly.
[acts.install]
ends = true
command = "install"
short = "inst"
kinds = ["list"]
changes = true
costly = true

# A ZSA board flashed with this machine's build, which takes it out of use
# while it's written, as an install does a device: Flash the Keyboard. An
# act, not an option, since what it leaves behind isn't a setting. Costly,
# as an install is.
[acts.flash]
ends = true
command = "flash"
short = "fla"
kinds = ["list"]
changes = true
costly = true

# The session's acts: :lock is Neovim's :lockmarks, so
# the screen's lock is :lockscreen.
[acts.lockscreen]
ends = true
command = "lockscreen"
short = "locks"
kinds = ["list"]
changes = true

[acts.suspend]
ends = true
command = "suspend"
short = "sus"
kinds = ["list"]
changes = true

# Logging out, rebooting and powering off end every window and session,
# so each is costly, where the lock and sleep give everything back as it
# was. Their rows arm on Return all the same (Arming.js).
[acts.logout]
ends = true
command = "logout"
short = "log"
kinds = ["list"]
changes = true
costly = true

[acts.reboot]
ends = true
command = "reboot"
short = "reb"
kinds = ["list"]
changes = true
costly = true

[acts.poweroff]
ends = true
command = "poweroff"
short = "pow"
kinds = ["list"]
changes = true
costly = true

# A VM's own acts, each apart from the machine's so no line meant for a VM
# can reach the machine it runs on. Started, Start It, as :boot, since
# :start is Neovim's :startinsert: nothing is lost by it, and a system
# VM's password, asked by polkit, is its asking, so it asks nothing more.
# Its short form clears Neovim's :botright.
[acts.boot]
command = "boot"
short = "boo"
kinds = ["list"]
changes = true
guarded = true

# Told to power itself off, as its power button would, Power It Off: it
# ends what it runs, but its own system closes its programs, which ask
# where work would be lost, as a window's do.
[acts.off]
ends = true
command = "off"
short = "off"
kinds = ["list"]
changes = true
guarded = true

# Its power cut, as pulling its plug would, Force It Off: whatever it
# hadn't written is lost, so it's costly. Its short form clears Vim's
# :for.
[acts.forceoff]
ends = true
command = "forceoff"
short = "forc"
kinds = ["list"]
changes = true
costly = true

