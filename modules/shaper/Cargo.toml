# shaper keeps the network's queue on this machine and sorts it by the
# slices' classes (src/main.rs says how).
[package]
name = "shaper"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
# A house with a key takes only reports its other machine signed with it,
# an HMAC-SHA256 (src/house.rs).
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The shape every command of ours takes: its flags, help, errors and exits.
terminal-kit = { path = "../terminal-kit" }
