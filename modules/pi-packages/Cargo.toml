# pi-packages installs each of pi's packages into a release folder of its own
# and swaps it in whole, never changing a file a running pi has loaded
# (src/lib.rs says how).
[package]
name = "pi-packages"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"
