# pi-packages installs each of pi's packages into a version folder of its own
# and swaps it in whole, never changing a file a running pi has loaded
# (src/lib.rs says how).
[package]
name = "pi-packages"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
# The shape every command of ours takes (docs/commands.md).
terminal-kit = { path = "../terminal-kit" }
# kill, to stop a warm's whole process group, and on a Mac libproc, which
# says what each process uses.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
