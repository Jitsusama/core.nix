# cadence watches how fast a change gets from its merge to the machine,
# writes the hour's card and asks the session keeping the cycle fast when a
# target slips (src/main.rs says how).
[package]
name = "cadence"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The subjects' hubs the realm's node names, and the needs put to them,
# read and kept one way with pain-points (../subject-hubs).
subject-hubs = { path = "../subject-hubs" }
# The shape every command of ours takes: its flags, help, errors and exits.
terminal-kit = { path = "../terminal-kit" }

[dev-dependencies]
tempfile = "3"
