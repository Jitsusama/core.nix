# cadence watches how fast a change gets from its merge to the machine,
# writes the hour's card and asks the session keeping the cycle fast when a
# target slips (src/main.rs says how).
[package]
name = "cadence"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
