# cadence watches how fast a change gets from its merge to the machine,
# writes the hour's card and asks the session keeping the cycle fast when a
# target slips (src/main.rs says how).
[package]
name = "cadence"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The serving side every daemon of the shell shares, for `cadence serve`
# (../daemon-serve).
daemon-serve = { path = "../daemon-serve" }
jiff = "0.2"
# The one form every daemon's rows take, kept so one row moving sends one
# (../ready-rows).
ready-rows = { path = "../ready-rows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Starts `cadence serve` for its test and asks it (../daemon-client).
daemon-client = { path = "../daemon-client" }
tempfile = "3"
