# cadence-spec: serves Joel's axes to the launcher's Spec place, as the
# rows cadence makes (src/main.rs says how).
[package]
name = "cadence-spec"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The serving side every daemon of the shell shares (../../daemon-serve).
daemon-serve = { path = "../../daemon-serve" }
# The one form every daemon's rows take, kept so one row moving sends one
# (../../ready-rows).
ready-rows = { path = "../../ready-rows" }
serde_json = "1"
# Its help, exits and failures, as every command's (docs/commands.md).
terminal-kit = { path = "../../terminal-kit" }

[dev-dependencies]
# Asks it over its socket in its test (../../daemon-client).
daemon-client = { path = "../../daemon-client" }
