# The clipboard's history for the launcher: one resident program that hears
# every text copy through the compositor's data-control protocol and hands
# it to the shell over a socket (src/main.rs says how).
[package]
name = "clipboard-history"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
