# One window's recording for the shell's recorder: asks niri for the window's
# screencast and has GStreamer encode it (src/main.rs says how).
[package]
name = "record-window"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
tokio = { version = "1.53", features = ["io-util", "macros", "process", "rt", "signal", "time"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
