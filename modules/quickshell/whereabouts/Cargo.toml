# Where the laptop is, for the launcher's weather: one resident program that
# asks GeoClue over D-Bus and writes where here is to a file the shell
# watches (src/main.rs says how).
[package]
name = "whereabouts"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt", "time"] }
# The name and zone of a new here, asked once each time it moves (named.rs).
ureq = "3.5"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
