# Where the laptop is, for the launcher's weather and the clock: one
# resident program that asks GeoClue over D-Bus and answers where here is
# over a socket in the shell's daemon interface (src/main.rs says how).
[package]
name = "whereabouts"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Its program goes by its domain's name, as its socket and units do, so
# ps and systemctl find it by the word its socket says (docs/daemons.md,
# Named). The crate keeps GeoClue's word for what it asks.
[[bin]]
name = "location"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# inotify, for the clock's zone, its move and the pin (notify.rs).
libc = "0.2"
# Location's rows, kept and placed in the form every daemon serves its
# rows in (serve.rs).
ready-rows = { path = "../../ready-rows" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt", "sync", "time"] }
# The name and zone of a new here, asked once each time it moves (named.rs).
ureq = "3.5"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
# The daemon started for a test, and its client, as every daemon's tests
# share them (tests/daemon.rs).
daemon-client = { path = "../../daemon-client" }
