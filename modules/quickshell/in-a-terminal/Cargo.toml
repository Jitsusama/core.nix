# `launcher`, the launcher in a terminal: any place, row or drawer the
# running shell holds, printed as text or JSON (src/main.rs says how).
[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde_json = "1.0"
# The shape every command of ours takes: its flags, help, errors and exits.
terminal-kit = { path = "../../terminal-kit" }
unicode-width = "0.2"
