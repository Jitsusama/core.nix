# hibernate-unlock lets the lock go after a resume from hibernation, which
# came through the disk prompt, and rescues one that rolled back (src/main.rs
# says how it knows each).
[package]
name = "hibernate-unlock"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# For reading the kernel's log without waiting at its end.
libc = "0.2.191"
serde_json = "1.0"
# The shape every command of ours takes (docs/commands.md).
terminal-kit = { path = "../../terminal-kit" }
