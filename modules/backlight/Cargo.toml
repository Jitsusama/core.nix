# backlight: sets the screen's brightness and warmth for the light in the
# room, and learns from the brightness Joel picks (src/main.rs says how).
[package]
name = "backlight"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The shape every command of ours takes: its flags, help, errors and exits.
terminal-kit = { path = "../terminal-kit" }
# niri's event stream, which says which program is in front (src/front.rs).
serde_json = "1.0"
# The sun's reckoning, which the launcher's calendars share.
sun = { path = "../sun" }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
