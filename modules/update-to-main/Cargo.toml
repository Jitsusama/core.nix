# update-to-main: root's program that updates its machine to its
# repository's main when asked, choosing everything itself (src/main.rs
# says how).
[package]
name = "update-to-main"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "update"
path = "tests/update/main.rs"
