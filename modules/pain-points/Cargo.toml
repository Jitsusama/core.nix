# pain-points names, from the launcher's own record of each opening and
# pi's session logs, the interactions that slowed Joel most today
# (src/main.rs says how).
[package]
name = "pain-points"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Chrome's history, opened from its bytes in memory (serialize), with
# SQLite built in, as chrome-recent-sites has it.
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
