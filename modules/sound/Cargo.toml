# The sound server's devices, held ready for the shell: one resident
# program that hears PipeWire through its own API and says each output
# and input as a record, sending only what changed, over a socket in the
# shell's daemon interface (src/main.rs says how).
[package]
name = "sound"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# PipeWire's own API, as dictation's noise-cancelled microphones hear it.
pipewire = { version = "0.10", features = ["v1_2_0"] }
serde_json = "1.0"

[dev-dependencies]
# The daemon started for a test, and its client, as every daemon's tests
# share them (tests/daemon.rs).
daemon-client = { path = "../daemon-client" }
