# nix-offload: lends the machine a builder elsewhere while its machine
# queue has builds one could take, and gives it back once idle (src/main.rs
# says how).
[package]
name = "nix-offload"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Which crates read which, shared with merge-net, so a change is replayed
# onto an older main only where ready would take its pass.
crate-reach = { path = "../../crate-reach" }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
