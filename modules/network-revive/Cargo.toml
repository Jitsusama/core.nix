# network-revive gives an account's units another go when the network
# changes (src/main.rs says how).
[package]
name = "network-revive"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "process", "rt", "time"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
