# terminal-kit: the shape every command of ours takes, for Joel in a
# terminal and for a machine through a pipe (docs/commands.md), a library
# each command names by path, so one copy of the shared flags, the
# theme's ink, the layout, help, errors and exit codes serves them all
# (src/lib.rs says how).
[package]
name = "terminal-kit"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
unicode-width = "0.2"
