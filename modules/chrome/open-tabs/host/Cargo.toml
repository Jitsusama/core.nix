# chrome-open-tabs answers the launcher with Chrome's open tabs, through the
# extension beside it (src/main.rs says how).
[package]
name = "chrome-open-tabs"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Chrome's messages and the extension's answers are JSON.
serde_json = "1"
