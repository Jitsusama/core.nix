# chrome-session: what Chrome has open now, read from its own session
# file, a library the programs daemon and chrome-recent-sites name by
# path, and a program printing it (src/lib.rs says how).
[package]
name = "chrome-session"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The shape every command of ours takes (docs/commands.md), and the JSON it
# answers in: the program's alone, so the crates reading the library by
# path (the programs daemon's) build without them.
terminal-kit = { path = "../../terminal-kit", optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = ["program"]
# The chrome-session program, which a crate naming the library leaves out
# with `default-features = false`.
program = ["dep:terminal-kit", "dep:serde_json"]
# Session files written as Chrome writes them, for a test standing a
# profile in for Chrome's, as the programs daemon's do.
written = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "chrome-session"
path = "src/main.rs"
required-features = ["program"]
