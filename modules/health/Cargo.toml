# health follows the machine's journals and keeps the day's tally of what
# they said, by kind, thing and signature, for Joel to read with `health`
# and for cadence to judge (src/main.rs says how).
[package]
name = "health"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
