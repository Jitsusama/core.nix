# elsewhere runs an agent's heavy job on another machine of the realm while
# this one is crowded (src/main.rs says how).
[package]
name = "elsewhere"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Its settings and mycelium's answers are JSON.
serde_json = "1.0"
# The shape every command of ours takes: its flags, help, errors and exits.
terminal-kit = { path = "../terminal-kit" }
