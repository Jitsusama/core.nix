# The pages wifid asks to find whether a network reaches beyond itself.
# Google's are what Android asks, so a network that wants a sign-in has
# long since learned to answer them the way wifid expects.

[Check]
# Asked over plain HTTP, which a network wanting a sign-in redirects or
# answers in the page's place. It answers 204 with nothing in it.
Page=http://connectivitycheck.gstatic.com/generate_204

# Asked over HTTPS when a card first reaches a network, which finds the
# networks that let the plain check through and nothing else.
SecurePage=https://www.google.com/generate_204
