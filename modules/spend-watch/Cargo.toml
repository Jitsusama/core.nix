# spend-watch keeps an account told what its AI use costs, from pi's own
# logs and whatever feeds a machine adds (src/lib.rs says how).
[package]
name = "spend-watch"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Bayesian online changepoints, for when a usual day changes.
augurs-changepoint = "0.10"
# Local days and hours, in the machine's zone, the database built in so the
# build and its tests need no zoneinfo.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
# The history, with SQLite built in.
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Notices, over D-Bus, without a runtime to install.
zbus = "5"

[dev-dependencies]
tempfile = "3"
