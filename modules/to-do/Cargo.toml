# The to-do daemon runs each of Joel's to-dos' checks and hears their
# signals, writing what it found for the harness and For You (src/main.rs
# says how).
[package]
name = "to-do"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The serving side of the shell's daemon interface every daemon holds.
daemon-serve = { path = "../daemon-serve" }
inotify = { version = "0.11", default-features = false }
jiff = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The daemon started for a test, and its client, as every daemon's tests
# share them (tests/daemon.rs).
daemon-client = { path = "../daemon-client" }
tempfile = "3"
