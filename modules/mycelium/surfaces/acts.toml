# The acts a surface lists in a file of its own, each its word there and
# the act of the table it is, or set apart with why it is no act on a cell.
# The launcher's are its session row's verbs, verb:agent:; its verbs under
# other ids, such as Carry Back and Pause All Agents, aren't read yet.

[[offered]]
surface = "launcher"
file = "modules/quickshell/launcher/words/agents.json"
pattern = '"id": "verb:agent:([a-z-]+)"'

[offered.acts]
switch = "go"
talk = "talk"
pause = "hold"
resume = "hold"
wake = "park"
stop = "stop"
close = "close"

[offered.apart]
take-back = "it undoes what the talk line's void did, an act on his own words, not on a cell"

# The map's are the acts a cell's drawer offers, by their words' keys; its
# keys, a for the next that needs him among them, aren't read.
[[offered]]
surface = "map"
file = "modules/mycelium/site/acts.ts"
pattern = '^  ([a-z]+): "'

[offered.acts]
go = "go"
talk = "talk"
sprout = "sprout"
forage = "forage"
