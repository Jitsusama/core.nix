# What Joel can do with his cells, and where. Every act is one he can take on
# each of four surfaces: the mycelium command (cli), a pi session (session),
# the mycelium map (map) and the launcher (launcher). Joel, 2026-11-24: "any
# interface i'm in should be directly engagable to a meaningful level".
#
# Each surface of each act says one of three things:
#
# - has: where it is, as a file of core.nix and the words it holds, or a
#   mycelium command and the words its --help says, or a pi tool by name;
# - owed: who brings it (a cell's address), by when (local time), and why
#   it isn't there yet;
# - waived: why the surface never will, in a sentence.
#
# An act's through names the one way to it every surface takes, so each
# surface that brings an act calls what the others call.
#
# A surface left out fails (stays-even.py), so an act one surface gains is
# owed by every other until it's there or waived. Where a surface lists its
# acts in a file of its own, an offered entry at the end reads that list, and
# an act in it the table doesn't name fails, so a gained act can't go unseen.
# Two are read: the launcher's session row, its verb:agent: ids, and the
# map's cell drawer, its acts' words in site/acts.ts.
# The pi tools aren't read, since the harness that holds them isn't an input
# of core.nix; each session has says where its tool does the act.
#
# A has proves its words are where it says, not that the surface's code
# offers the act, which the surfaces' own tests prove, nor that an act is
# worded the same on each surface. An owing's due time is read by people and
# J7XHQN, not by the check, which has no clock.

