# Tuple's call, for the desktop: one resident program that follows Tuple's
# stream of state and its log, and hands the call Joel's in, a ring and a
# missed call to the shell over a socket, doing what the shell asks of the
# call through Tuple's own command (src/main.rs says how).
[package]
name = "tuple-call"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The serving side every daemon of the shell shares (../../daemon-serve).
daemon-serve = { path = "../../daemon-serve" }
inotify = { version = "0.11", default-features = false }
serde_json = "1"

[dev-dependencies]
# The daemon started for a test, and its client, as every daemon's tests
# share them (tests/daemon.rs).
daemon-client = { path = "../../daemon-client" }
