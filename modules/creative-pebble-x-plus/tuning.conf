# Creative's Pebble X Plus speakers, with their three loudest peaks taken
# down. Kostya's measurement of the Pebble X on Audio Science Review, on axis
# at 0.5 m in a semi-anechoic room, reads the midrange at about 84.6 dB SPL
# from 300 Hz to 1.4 kHz, and above it:
#
#   1.5 to 3.4 kHz   a broad lift of about 4.5 dB, centred near 2.3 kHz
#   10.2 kHz         a peak of 10.6 dB, half its height from 9.0 to 11.8 kHz
#   17 kHz           a peak of 10 dB, half its height from 15.1 to 18.7 kHz
#   7.2 kHz          a dip of 3 dB
#
# The X Plus has the same two 2.75" full-range drivers with a subwoofer
# below them. The review calls the 10 kHz peak "very (too much) pronounced
# sibilants" and suggests cutting it.
#
# Each cut is shallower than its peak, since that was another unit, and the X
# rather than the X Plus, heard on axis where a desk is mostly off it. There
# are no boosts: the dip at 7.2 kHz is left, as a boost into a dip is wrong
# wherever the measurement is, and nothing below 1 kHz is touched, where the
# subwoofer and the desk shape the sound more than the drivers do. With only
# cuts, the tuning can't take a signal past full scale, so it needs no
# limiter.
#
# This is a WirePlumber smart filter on the speakers, as the XPS 14's tuning
# is, so the speakers stay the device programs see and sound goes through the
# filter only while it's headed for them. It finds them by their USB id, so
# any Pebble X Plus gets it, and while none is plugged in it waits unlinked.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Pebble X Plus Tuning"
        media.name       = "Pebble X Plus Tuning"

        filter.graph = {
          nodes = [
            { type = builtin name = lift_l  label = bq_peaking control = { "Freq" = 2300.0 "Q" = 1.2 "Gain" = -2.5 } }
            { type = builtin name = sib_l   label = bq_peaking control = { "Freq" = 10200.0 "Q" = 3.5 "Gain" = -6.0 } }
            { type = builtin name = air_l   label = bq_peaking control = { "Freq" = 17000.0 "Q" = 4.5 "Gain" = -5.0 } }

            { type = builtin name = lift_r  label = bq_peaking control = { "Freq" = 2300.0 "Q" = 1.2 "Gain" = -2.5 } }
            { type = builtin name = sib_r   label = bq_peaking control = { "Freq" = 10200.0 "Q" = 3.5 "Gain" = -6.0 } }
            { type = builtin name = air_r   label = bq_peaking control = { "Freq" = 17000.0 "Q" = 4.5 "Gain" = -5.0 } }
          ]

          links = [
            { output = "lift_l:Out" input = "sib_l:In" }
            { output = "sib_l:Out"  input = "air_l:In" }
            { output = "lift_r:Out" input = "sib_r:In" }
            { output = "sib_r:Out"  input = "air_r:In" }
          ]

          inputs  = [ "lift_l:In" "lift_r:In" ]
          outputs = [ "air_l:Out" "air_r:Out" ]
        }

        audio.channels = 2
        audio.position = [ FL FR ]

        capture.props = {
          node.name   = "pebble_x_plus_tuning"
          media.class = Audio/Sink
          filter.smart = true
          filter.smart.name = "pebble-x-plus-tuning"
          filter.smart.target = {
            alsa.components = "USB041e:329a"
            media.class     = "Audio/Sink"
          }
        }
        playback.props = {
          node.name    = "pebble_x_plus_tuning_output"
          # Lets the speakers suspend when nothing is playing.
          node.passive = true
          # Keeps role-based sinks from claiming the filter's output.
          media.role   = "DSP"
        }
      }
    }
]
