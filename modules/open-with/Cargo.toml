# open-with: the portal's chooser of an app to open something with, asked
# in the launcher rather than in a dialog of GNOME's (src/main.rs says how).
[package]
name = "open-with"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1.53", features = ["macros", "net", "rt", "sync", "time"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
