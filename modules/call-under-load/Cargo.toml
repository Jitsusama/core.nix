# call-under-load runs a Meet-shaped test call under the machine's own
# load each hour, for cadence (src/main.rs says how).
[package]
name = "call-under-load"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The shape every command of ours takes: its flags, help, errors and ink.
terminal-kit = { path = "../terminal-kit" }
