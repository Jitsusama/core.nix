# zathura-next-document: opens the next or the previous document in the
# folder of the one a zathura shows, as Vim's ]b and [b go between buffers
# (src/main.rs says how).
[package]
name = "zathura-next-document"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
terminal-kit = { path = "../../terminal-kit" }
