# The MV7's headphone jack, through the control its firmware calls USB
# Streaming: its volume, -24 to 0 dB, is the one the touch strip slides.

[General]
description-key = analog-output-headphones

[Element USB Streaming]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
