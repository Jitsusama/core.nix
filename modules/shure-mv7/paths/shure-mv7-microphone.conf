# The MV7's microphone, through the control its firmware calls Microphone:
# its switch is the mute the touch pad flips, and its volume the gain, 0 to
# 36 dB.

[General]
description-key = analog-input-microphone

[Element Microphone]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
