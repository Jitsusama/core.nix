# The Shure MV7's voice brought up to the level programs expect, the room
# turned down between words, its speaker's s sounds softened, and its peaks
# held under full scale. Measured on a desk where the mic sits about 45 cm
# from the speaker, on a stand with no arm to bring it closer, in the mic's
# own auto level mode at its 30 dB ceiling:
#
#   the room, between words      -71 to -73 dBFS RMS
#   speech, read aloud            -41 dBFS RMS, peaks at -19.5
#   a loud line, said on purpose  -29 dBFS RMS, peaks at -6.6
#   the whole, as loudness        -35.4 to -35.6 LUFS
#   s sounds                      peaking at 6.7 kHz, 25 dB over the vowels
#                                 in 6.3 to 8 kHz, a median -46 dBFS in 5 to
#                                 9.5 kHz against -70 for other speech there
#
# Calls, dictation and recordings aim for about -16 to -23 LUFS, so the voice
# arrived 12 to 19 dB short, and the mic could give no more: in auto level
# mode it ignores its gain setting, which measured the same tone within
# 0.1 dB at 36 dB and 27.
#
# The mic's auto level stays on. It sets the codec's analog gain itself and
# turns it down for an excited voice before the converter, where nothing
# after it could stop a clip. This filter adds what it can't, in order:
#
#   12 dB of gain, bringing speech to about -25 LUFS
#   a downward expander from -50 dBFS at 2:1, taking pauses down 6.5 dB
#     (-58 to -65 dBFS) and leaving soft speech within 0.4 dB
#   a de-esser on 5 to 9.5 kHz alone, from -52 dBFS at 10:1, taking s sounds
#     down a median 12 dB in that band and leaving vowels as they were
#   a limiter at -1 dBFS for whatever an excited voice still carries past
#     that, which is more than a loud line said on purpose
#
# The speaker compared each step by ear, at matched loudness, against the one
# before, and chose these. Room echo is left: at 45 cm the walls come back
# about 11 dB under each word, and nothing that removes it adds no delay.
#
# A program recording through the filter hears it one graph cycle late, which
# PipeWire spares only the mic itself, plus the limiter's lookahead. While
# the filter runs, it asks for a 256-sample cycle and the limiter looks 1 ms
# ahead, so that's 6.3 ms, measured on the mic, rather than 26 at the usual
# 1024 and 5 ms. The filter costs about 2% of a core while something records,
# and nothing otherwise.
#
# It's a WirePlumber smart filter on the mic, as the speakers' tunings are on
# theirs: the mic stays the device programs record from, and they hear it
# through the filter. It finds the mic by its USB id, and while none is
# plugged in it waits unlinked.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Shure MV7 Voice"
        media.name       = "Shure MV7 Voice"

        filter.graph = {
          nodes = [
            # The 12 dB, then the room turned down below -50 dBFS. Its default
            # mode expands upward, so "em" picks downward.
            { type   = lv2
              name   = room
              plugin = "http://lsp-plug.in/plugins/lv2/expander_mono"
              control = {
                "g_in" = 3.981
                "em"   = 0
                "al"   = 0.003162
                "er"   = 2
                "at"   = 5
                "rt"   = 50
                "hold" = 40
              }
            }
            # Three bands split at 5 and 9.5 kHz, with only the middle one
            # compressed. "envb" off, so the threshold reads the band's own
            # level rather than one tilted toward its top.
            { type   = lv2
              name   = deesser
              plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_mono"
              control = {
                "envb"  = 0
                "cbe_1" = 1
                "sf_1"  = 5000
                "cbe_2" = 1
                "sf_2"  = 9500
                "cbe_3" = 0
                "cbe_4" = 0
                "cbe_5" = 0
                "cbe_6" = 0
                "cbe_7" = 0
                "ce_0"  = 0
                "ce_2"  = 0
                "ce_1"  = 1
                "al_1"  = 0.00251
                "cr_1"  = 10
                "at_1"  = 1
                "rt_1"  = 50
              }
            }
            { type   = lv2
              name   = limiter
              plugin = "http://lsp-plug.in/plugins/lv2/limiter_mono"
              control = {
                "th"    = 0.891
                "lk"    = 1
                # "boost" would raise the output until the threshold met full
                # scale, past the -1 dBFS kept free for programs that
                # resample or encode. "alr" stays on: it rides the gain down
                # through a long excited stretch rather than limiting every
                # peak of it.
                "boost" = 0
              }
            }
          ]
          links = [
            { output = "room:out"    input = "deesser:in" }
            { output = "deesser:out" input = "limiter:in" }
          ]
          inputs  = [ "room:in" ]
          outputs = [ "limiter:out" ]
        }

        audio.channels = 1
        audio.position = [ MONO ]

        capture.props = {
          node.name    = "shure_mv7_voice_input"
          # Lets the mic suspend when nothing is recording.
          node.passive = true
          node.latency = 256/48000
          # Waits for the MV7 rather than taking the default microphone
          # while it's away, which held the laptop's own mic open for
          # nobody. Lingering keeps the filter waiting rather than
          # WirePlumber destroying it when it finds no MV7.
          node.dont-fallback = true
          node.linger        = true
        }
        playback.props = {
          node.name   = "shure_mv7_voice"
          media.class = Audio/Source
          filter.smart = true
          filter.smart.name = "shure-mv7-voice"
          filter.smart.target = {
            alsa.components = "USB14ed:1012"
            media.class     = "Audio/Source"
          }
        }
      }
    }
]
