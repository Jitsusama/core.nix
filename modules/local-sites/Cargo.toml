# The local sites' server: Joel's sites on loopback, and a live feed from
# each daemon a site reads, bridged from a page's WebSocket to the daemon's
# own socket (src/main.rs says how).
[package]
name = "local-sites"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The shape every command of ours takes: its flags, help, errors and exits.
terminal-kit = { path = "../terminal-kit" }
# The daemon interface's watch, held as every client of a daemon holds it,
# and its answers trimmed as a daemon trims them.
daemon-serve = { path = "../daemon-serve" }
# A request's head, read where it was only peeked, so a feed's handshake
# still finds it.
httparse = "1.10.1"
serde_json = "1.0.154"
# A page's feed, over a WebSocket on a plain thread per page, as every
# daemon here serves a client; only the handshake and frames, no TLS,
# since it's loopback.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
