# spotify-recent says what Spotify played lately, Joel's playlists and how
# many songs he likes, and plays one, for Spotify's Recent and acts in the
# launcher (src/main.rs says how).
[package]
name = "spotify-recent"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
# The shape every command of ours takes (docs/commands.md).
terminal-kit = { path = "../../terminal-kit" }
