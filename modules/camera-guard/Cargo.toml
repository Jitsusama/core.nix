# camera-guard keeps agents from opening a camera near Joel's meetings
# (src/main.rs says how).
[package]
name = "camera-guard"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# bpf(2), which the standard library doesn't wrap.
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The shape every command of ours takes: its flags, help, errors and exits.
terminal-kit = { path = "../terminal-kit" }
