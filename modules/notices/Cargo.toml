# The notices daemon: the session bus's notifications server, holding
# every notice and its history and serving each to the shell as one
# record (src/lib.rs says how). senders.json names the senders whose
# notices a reply of their own answers, so none is counted as missed.
[package]
name = "notices"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The serving side every daemon of the shell shares (../daemon-serve).
daemon-serve = { path = "../daemon-serve" }
# A picture sent as pixels, written as a file the history keeps.
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The session bus, without tokio, as machine's daemon has it.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
# Starts the daemon for its test and asks it (../daemon-client).
daemon-client = { path = "../daemon-client" }
