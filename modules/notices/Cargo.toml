# The notices daemon: the session bus's notifications server, holding
# every notice and its history and serving each to the shell as one
# record, and each one's rows for the launcher (src/lib.rs says how).
# senders.json names the desktop's own senders, and those whose notices a
# reply of their own answers, so none is counted as missed.
[package]
name = "notices"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The serving side every daemon of the shell shares (../daemon-serve).
daemon-serve = { path = "../daemon-serve" }
# A picture sent as pixels, written as a file the history keeps.
png = "0.18"
# The desktop's data folders, where its entries are (../programs).
programs = { path = "../programs" }
# The one form every daemon's rows take, kept so one row moving sends one
# (../ready-rows).
ready-rows = { path = "../ready-rows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The session bus, without tokio, as machine's daemon has it.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# The desktop entries, read, followed and matched as the shell's
# heuristicLookup does, so a sender is named and gone to by the program
# its windows are (../windows).
windows = { path = "../windows" }

[dev-dependencies]
# Starts the daemon for its test and asks it (../daemon-client).
daemon-client = { path = "../daemon-client" }
