# Who Slack knows by an email address, for People's Slack source, and what
# in Slack wants Joel, for Now: two small programs that read the harness's
# Slack sign-in and ask Slack's own API, only ever reading (src/main.rs and
# src/bin/slack-unreads.rs say how).
[package]
name = "slack-people"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The one form every daemon's rows take, its spaced order keeping each
# row's where it can, so one conversation moving sends one row
# (../ready-rows).
ready-rows = { path = "../ready-rows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
