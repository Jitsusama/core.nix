# Who Slack knows by an email address, for People's Slack source: a small
# program that reads the harness's Slack sign-in and asks Slack's own API,
# only ever reading (src/main.rs says how).
[package]
name = "slack-people"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
