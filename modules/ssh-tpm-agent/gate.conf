# Where ssh-tpm-agent refuses to serve (refuses-agents.patch): the places
# core's slices give agents' work, which the jobs broker's place.rs and
# polkit's agents-ask-first.rules each name for their own ends, and pi's own
# spawners. Session windows' kitty, in agents.slice, runs pi, so it's
# refused with the rest of that slice; Joel's own terminals are in app.slice,
# which no line names. The agent judges a peer by the first process in its
# chain, the peer first and then each parent, whose cgroup a line below
# names, and a chain naming none is served. So a command an agent starts is
# refused while it's still a child of a refused place, even in a scope
# somewhere unnamed (systemd-run --scope); a service it starts, whose parent
# is the user manager, is served. What Joel runs at his own terminal is
# served there, and in jobs-awaited.slice once the sorter moves it, allowed
# only at that slice's own cgroups so nothing made inside them inherits it.
# Each line is a regular expression over a cgroup's path; gate-cases.txt
# holds what each must decide.
allow /jobs\.slice/jobs-awaited\.slice/(awaited\.service|work-[0-9]+-[0-9]+\.scope)$
refuse /(agents|jobs-work|jobs-timed|shared)\.slice/
refuse /jobs\.slice/jobs\.service(/|$)
refuse /pi-jobs-[^/]*\.scope(/|$)
refuse /pi-spawner-[^/]*\.scope(/|$)
