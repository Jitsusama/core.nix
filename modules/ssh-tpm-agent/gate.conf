# Where ssh-tpm-agent refuses to serve (refuses-agents.patch): the places
# core's slices give agents' work, which the jobs broker's place.rs and
# polkit's agents-ask-first.rules each name for their own ends, and pi's own
# spawners. Session windows' kitty, in agents.slice, runs pi, so it's
# refused with the rest of that slice, and so is a shell in a tab or window
# opened from one: the gate judges by cgroup, and that shell's is pi's
# kitty's, so ssh there finds no key (ssh-add -l says the agent refused),
# and a commit signed there as Joel isn't. Joel's own terminals are in
# app.slice, which no line names. A pi Joel starts in one of them is his,
# as an editor is, and is served; the commands it runs are in its
# spawners' scopes, refused. The agent judges a peer by the first process
# in its chain, the peer first and then each parent, whose cgroup a line
# below names, and a chain naming none is served. So a command an agent
# starts is refused while it's still a child of a refused place, even in a
# scope somewhere unnamed (systemd-run --scope). A unit systemd-run starts
# from agents' work lands in jobs-work.slice when its caller is in
# jobs.service, a spawner's scope or a pi host's or conversation's unit,
# and in the caller's slice otherwise (modules/slices' systemd-run.sh).
# jobs.slice's own units, which an explicit --slice-inherit still makes
# there, are refused. A few of Joel's own services run there and in
# jobs-timed.slice too, sccache's, load-proof's and merge-net's (the net
# and changed-checks' keeper), and are refused knowingly, since none signs
# in over SSH. Agents' work placed in
# jobs-awaited.slice or background.slice lands its systemd-run units there
# too, as run-*.service under the user manager, looking just like one
# Joel's own work started there; so those are refused, Joel's with them,
# while a scope, nix-offload's uploads among them, keeps its caller as its
# parent and is judged by it. Agents start their long work as units they
# name, so every service in jobs-awaited.slice but awaited.service, the one
# declared there, is refused too; the last four lines spell out any name
# but awaited, by its length or where it differs, as the expressions have
# no lookahead. One an agent names in background.slice, among Joel's own
# daemons, is served. What Joel runs at his own terminal is served there,
# and in jobs-awaited.slice once the sorter moves it, which no line names
# whole: an allow there would serve a peer whatever its parents, and a
# cgroup made inside an agent's own place under that name with them.
# Each line is a regular expression over a cgroup's path; gate-cases.txt
# holds what each must decide.
refuse /(agents|jobs-work|jobs-timed|shared)\.slice/
refuse /jobs\.slice/[^/]+\.(service|scope)(/|$)
refuse /pi-jobs-[^/]*\.scope(/|$)
refuse /pi-spawner-[^/]*\.scope(/|$)
refuse /background\.slice/run-[^/]+\.service(/|$)
refuse /jobs-awaited\.slice/([^/]{1,6}|[^/]{8,})\.service(/|$)
refuse /jobs-awaited\.slice/([^a/][^/]{6}|a[^w/][^/]{5}|aw[^a/][^/]{4})\.service(/|$)
refuse /jobs-awaited\.slice/(awa[^i/][^/]{3}|awai[^t/][^/]{2}|await[^e/][^/])\.service(/|$)
refuse /jobs-awaited\.slice/awaite[^d/]\.service(/|$)
