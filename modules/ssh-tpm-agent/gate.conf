# Where ssh-tpm-agent refuses to serve (refuses-agents.patch): the places
# core's slices give agents' work, as polkit's agents-ask-first.rules names
# them, and pi's own spawners. The agent judges a peer by the first process
# in its chain, the peer first and then each parent, whose cgroup a line
# below names, so a command an agent starts is refused even after it moves
# somewhere unnamed, and a chain naming none is served. What Joel runs at a
# terminal is in a kitty window's scope, or in jobs-awaited.slice once the
# sorter moves it, both allowed before agents.slice is refused. Each line
# is a regular expression over a cgroup's path; gate-cases holds what each
# must decide.
allow /jobs\.slice/jobs-awaited\.slice/
allow /agents\.slice/sessions-kitty\.service$
allow /agents\.slice/kitty-[0-9]+-[0-9]+\.scope$
refuse /(agents|jobs-work|jobs-timed|shared)\.slice/
refuse /jobs\.slice/jobs\.service(/|$)
refuse /pi-jobs-[^/]*\.scope(/|$)
refuse /pi-spawner-[^/]*\.scope(/|$)
