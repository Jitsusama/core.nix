# memory-modules says which memory modules the firmware lists, for the
# launcher's Memory (src/main.rs says how).
[package]
name = "memory-modules"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
