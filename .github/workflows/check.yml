# Runs every check on each pull request and on main, as a backstop for the
# local loop, which is where checks are meant to catch things: nothing waits on
# this. Evaluating machines is most of what a check costs, so the checks that
# don't boot a virtual machine run together in one evaluation, and each
# virtual machine test gets a runner of its own beside them. The darwin checks
# evaluate on Linux, so one platform covers both. Actions are pinned by
# commit, with the release they came from beside each.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: every check but the virtual machine tests
        run: |
          nix eval --raw .#checks.x86_64-linux --apply '
            checks: builtins.concatStringsSep "\n" (map (name: ".#checks.x86_64-linux." + name)
              (builtins.filter (name: builtins.substring 0 3 name != "vm-")
                (builtins.attrNames checks)))' > checks
          mapfile -t checks < checks
          nix build --no-link --print-build-logs "${checks[@]}"

  vm-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - vm-secure-boot-installs
          - vm-commits-are-signed
          - vm-keyring-opens-without-asking
          - vm-speakers-are-tuned
          - vm-desktop-works
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - run: nix build --no-link --print-build-logs .#checks.x86_64-linux.${{ matrix.test }}
