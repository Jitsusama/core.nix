# core.nix owns the pins every host builds from, so it moves them forward
# itself. Each week this updates flake.lock, runs every check against the new
# pins, and opens a pull request only when they pass. The checks run here
# because a pull request opened with the workflow's own token does not start
# the check workflow.
name: update

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - id: update
        run: |
          {
            echo 'changes<<EOF'
            nix flake update 2>&1
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - run: nix flake check --print-build-logs
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-flake-lock
          commit-message: "build(deps): update flake.lock"
          title: "build(deps): update flake.lock"
          labels: dependencies
          body: |
            Every check passed against these pins in the run that opened this.

            ```text
            ${{ steps.update.outputs.changes }}
            ```
