# A ruff config every-ruff-exception-hides-a-finding.sh plants for the rule to
# refuse before ruff runs: it keeps per-file exceptions in each place the rule
# doesn't read, as the check's expected lines say.
extend = "base.toml"

[per-file-ignores]
"a.py" = ["F401"]

[extend-per-file-ignores]
"a.py" = ["F401"]

[lint.extend-per-file-ignores]
"a.py" = ["F401"]

[lint.per-file-ignores]
"b.py" = ["F401"]
