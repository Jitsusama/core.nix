# A ruff config every-ruff-exception-hides-a-finding.sh plants for the rule to
# refuse before ruff runs: it keeps per-file exceptions in each place the rule
# doesn't read, names one code twice for one pattern and gives another a
# string, as the check's expected lines say.
extend = "base.toml"

[per-file-ignores]
"a.py" = ["F401"]

[extend-per-file-ignores]
"a.py" = ["F401"]

[lint.extend-per-file-ignores]
"a.py" = ["F401"]

[lint.per-file-ignores]
"b.py" = ["F401", "F401"]
"c.py" = "F401"
