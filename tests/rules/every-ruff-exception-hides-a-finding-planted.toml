# The ruff config of the tree every-ruff-exception-hides-a-finding.nix plants
# to see the rule fail. Each file it names holds what its comment says, and the
# rule must name clean.py's exception, twice.py's (the first of the pair),
# pair.py's F4, printed.py's T201 and noqa.py's, as the check's expected lines
# say.

# Fixing would change the tree between runs, so each run must fix nothing.
fix = true

[lint]
select = ["ALL"]
# Off everywhere, so an exception for it hides nothing.
ignore = ["T201"]

[lint.per-file-ignores]
# An unused import, which the exception hides.
"hidden.py" = ["F401"]
# An unused import, hidden by a prefix that selects its rule.
"prefixed.py" = ["F4"]
# Nothing to hide.
"clean.py" = ["F401"]
# An unused import, hidden twice over: one of the two can go, not both.
"twice.py" = ["F401"]
"twic*.py" = ["F401"]
# An unused import, hidden by a prefix and by its rule: one of the two can go.
"pair.py" = ["F4", "F401"]
# A print, whose rule the config ignores everywhere.
"printed.py" = ["T201"]
# An unused import its line's noqa hides, so the exception hides nothing,
# though with it the noqa is unused, a finding that goes with the exception.
"noqa.py" = ["F401"]
# Two files: one holds a real unused import, which the exception hides, and
# one an import its noqa hides. Without the exception one finding comes back
# as the unused noqa's goes, so their count holds while the exception stays.
"mixed*.py" = ["F401"]
