# A time server on the test VM itself, serving the VM's own clock on a port
# of its own beside the machine's chronyd, which keeps the clock by it, so
# Time has a chosen server with true figures and no network is needed.
port @port@
bindaddress 127.0.0.1
allow 127.0.0.1
local stratum 2
# It answers no commands, so it never takes the machine's chronyd's port or
# socket.
cmdport 0
bindcmdaddress /
pidfile /run/time-stand-in/chronyd.pid
