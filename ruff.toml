# How ruff formats and lints the repository's Python, test code included:
# every rule, less the few that contradict another or the formatter, and
# those that don't fit what these files are. treefmt.nix runs it.
line-length = 100
target-version = "py314"

[lint]
select = ["ALL"]
ignore = [
  # Docstrings open on their first line, with no blank line before them in
  # a class, which rules out the opposite rules D213 and D203.
  "D203",
  "D213",
  # The formatter decides trailing commas and how strings join.
  "COM812",
  "ISC001",
  # The scripts are programs read in or run by path, not packages.
  "INP001",
  # They are command-line programs, so print is how they speak.
  "T201",
  # The licence is the repository's, in LICENSE, not a line in each file.
  "CPY001",
]

[lint.per-file-ignores]
# A test's name is the sentence it proves, so a docstring would repeat it,
# and a test says what has to hold with assert, which is never run with -O.
"*-test.py" = ["D103", "S101"]
# A unittest suite, named test_*.py as unittest finds them, says what has to
# hold through its TestCase's assertions, since that's how unittest reports
# what each side held. Repositories built on core read this file too, and
# may keep such a suite until it moves to pytest.
"test_*.py" = ["PT009", "PT027"]
# A VM test's script imports the driver's names only for type checkers
# (driver_names.pyi), since the driver gives them to it as globals. The
# driver's retry hands each try whether it's the last as a plain positional
# bool, so what a script gives retry has to take one.
# A script the driver runs top to bottom asserts through the driver's `t`, a
# unittest TestCase, until it moves to pytest.
"*-vm-test.py" = ["TC004", "FBT001", "PT009", "PT027"]
# The desktop its areas drive asserts what a test needs, as pytest reports what each side
# held, and hands the driver's retry a test taking a positional bool, as the driver calls it.
"tests/desktop/desktop_session.py" = ["FBT001", "S101"]
