# How mypy reads the repository's Python, test code included: strictly, so
# every function says its types and nothing is Any by accident. treefmt.nix
# runs it, with the libraries the scripts import.
[mypy]
strict = True
python_version = 3.14

# jeepney and python-xlib, which the desktop test's stand-ins speak D-Bus
# and X11 with, ship no types, and nixpkgs has no stubs for them, so what
# they give is read as untyped.
[mypy-jeepney.*,Xlib.*]
ignore_missing_imports = True
