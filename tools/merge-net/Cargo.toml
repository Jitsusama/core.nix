# merge-net: the net under core's main, which runs the VM tests each merge
# changed after it lands and reverts a merge that breaks one (src/main.rs
# says how).
[package]
name = "merge-net"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Which crates read which, shared with nix-offload's replay, so both judge
# what main moved beside a change alike.
crate-reach = { path = "../../modules/crate-reach" }
serde_json = "1"
