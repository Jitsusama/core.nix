# The Surface Laptop 4's built-in microphones, a digital pair on the
# ALC274 codec. PipeWire's own path for an internal mic turns its boost
# and the capture gain up together, so the desktop's full volume was 60 dB
# of gain and 91% to 96% of samples sat at full scale. Here the boost stays
# at 0 dB and the capture gain stops at 39 of 63, 12 dB over its 0 dB step
# (23; each step is 0.75 dB). At the mics' own level a voice from the usual
# seat peaked at -26 dBFS, clear but too quiet; 12 dB brings it to about
# -14, still well short of full scale.

[General]
priority = 89
description-key = analog-input-microphone-internal

# A microphone plugged into the headset jack takes over from these.
[Jack Mic]
state.plugged = no
state.unplugged = unknown

[Element Capture]
switch = mute
volume = merge
volume-limit = 39
override-map.1 = all
override-map.2 = all-left,all-right

[Element Internal Mic Boost]
volume = zero
override-map.1 = all
override-map.2 = all-left,all-right
