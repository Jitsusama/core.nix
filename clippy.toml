# clippy's settings for every Rust crate and program here; checks.nix says
# which lints it holds them to. cargo clippy finds this file from any crate
# below it, and the checks point clippy at it.

# Names of things, programs and protocols that read as code to clippy. A name
# from code, an interface or a specification still takes backticks.
doc-valid-idents = [
  "DHCPv4",
  "DisplayPort",
  "ErgoDox",
  "GStreamer",
  "GeoClue",
  "MSCHAPv2",
  "NVMe",
  "OpenVINO",
  "PipeWire",
  "SplitMix64",
  "UDisks2",
  "UPower",
  "wpa_supplicant",
  "YubiKey",
  "YubiKeys",
  "..",
]
